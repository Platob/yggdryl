# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Yggdryl
site_description: Arrow-native schema and record values, resource identifiers, byte codecs, and language bindings
site_url: https://platob.github.io/yggdryl/
repo_name: Platob/yggdryl
repo_url: https://github.com/Platob/yggdryl
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - assets/yggdryl.css

extra_javascript:
  - assets/playground.js
  - assets/fix-explorer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Platob/yggdryl
      name: Yggdryl on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/yggdryl
      name: The crate
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/yggdryl/
      name: The Python package
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/yggdryl
      name: The Node package

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section

nav:
  - Home:
    - index.md
    - Getting started: getting-started.md
    - Architecture: architecture.md
    - Testing: testing.md
    - Benchmarks: benchmarks.md
    - Contributing: contributing.md
  - Types:
    - types/index.md
    - Core:
      - DataType: types/datatype.md
      - Field: types/field.md
      - Paths: types/paths.md
      - Scalar: types/scalar.md
      - Cast: types/cast.md
    - Families:
      - Numeric: types/numeric.md
      - Temporal: types/temporal.md
      - Strings & bytes: types/text.md
      - Codes: types/codes.md
      - UUID: types/uuid.md
      - Nested: types/nested.md
      - Serie: types/serie.md
      - Geospatial: types/geospatial.md
      - Variant encoding: types/variant.md
      - Protocol: types/protocol.md
    - Playground: types/playground.md
  - Holder:
    - holder/index.md
    - IOBase:
      - Bytes: holder/iobase/bytes.md
      - Calls: holder/iobase/calls.md
      - Values: holder/iobase/values.md
      - Records: holder/iobase/records.md
      - Partitions: holder/iobase/partitions.md
    - Backends:
      - Buffer: holder/backends/buffer.md
      - Local: holder/backends/local.md
      - Filesystems: holder/backends/filesystems.md
      - Object stores: holder/backends/object.md
      - Buffered: holder/backends/buffered.md
      - ZIP: holder/backends/zip.md
  - Coding:
    - coding/index.md
    - gzip: coding/gzip.md
    - zlib: coding/zlib.md
    - zstd: coding/zstd.md
  - Charset:
    - charset/index.md
    - Encodings: charset/encodings.md
    - Transcoded: charset/transcoded.md
    - Streams: charset/streams.md
  - Media:
    - media/index.md
    - Shared:
      - RecordOptions: media/options.md
      - Structured documents: media/structured.md
      - Placeholders: media/placeholders.md
    - Arrow IPC:
      - media/ipc/index.md
      - Scalars: media/ipc/scalar.md
      - Arrow: media/ipc/arrow.md
    - Apache Parquet:
      - media/parquet/index.md
      - Scalars: media/parquet/scalar.md
      - Arrow: media/parquet/arrow.md
      - Footer: media/parquet/footer.md
    - Apache Avro:
      - media/avro/index.md
      - Scalars: media/avro/scalar.md
      - Arrow: media/avro/arrow.md
    - Plain text:
      - media/text/index.md
      - Scalars: media/text/scalar.md
      - Arrow: media/text/arrow.md
    - JSON:
      - media/json/index.md
      - Scalars: media/json/scalar.md
      - Arrow: media/json/arrow.md
    - YAML:
      - media/yaml/index.md
      - Scalars: media/yaml/scalar.md
      - Arrow: media/yaml/arrow.md
    - TOML:
      - media/toml/index.md
      - Scalars: media/toml/scalar.md
      - Arrow: media/toml/arrow.md
    - Iceberg:
      - media/iceberg/index.md
      - Reading: media/iceberg/read.md
      - Writing: media/iceberg/write.md
      - Catalog: media/iceberg/catalog.md
      - Schemas: media/iceberg/schema.md
  - URI:
    - uri/index.md
    - Path: uri/path.md
    - URL and URN: uri/url-urn.md
    - Query parameters: uri/parameters.md
    - Patterns: uri/patterns.md
  - Arrow:
    - arrow/index.md
    - Scalars: arrow/scalars.md
    - Values: arrow/values.md
    - Schema: arrow/schema.md
    - Readers: arrow/readers.md
  - Expression:
    - expression/index.md
    - Grammar: expression/grammar.md
    - Terms: expression/terms.md
    - Selectors: expression/selectors.md
    - Filters: expression/filters.md
    - Functions: expression/functions.md
    - Plans: expression/plans.md
    - Holder attributes: expression/holder.md
    - Evaluate: expression/evaluate.md
  - Hashing: hashing.md
  - Graph: graph.md
  - FIX:
    - fix/index.md
    - Explorer: fix/explorer.md
    - Decode: fix/decode.md
    - Encode: fix/encode.md
    - Registry: fix/registry.md
    - Store: fix/store.md
    - Message: fix/message.md
    - Arrow: fix/arrow.md
    - Capture: fix/capture.md
    - Lifecycle: fix/lifecycle.md
    - CLI: fix/cli.md

validation:
  links:
    anchors: warn
    absolute_links: warn
    not_found: warn
    unrecognized_links: warn
  nav:
    absolute_links: warn
    not_found: warn
    omitted_files: warn

copyright: Copyright &copy; Yggdryl contributors
