# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Yggdryl
site_description: Arrow-native schema and record values, resource identifiers, byte codecs, and language bindings
site_url: https://platob.github.io/yggdryl/
repo_name: Platob/yggdryl
repo_url: https://github.com/Platob/yggdryl
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - assets/yggdryl.css

extra_javascript:
  - assets/playground.js
  - assets/fix-explorer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Platob/yggdryl
      name: Yggdryl on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/yggdryl
      name: The crate
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/yggdryl/
      name: The Python package
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/yggdryl
      name: The Node package

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section

nav:
  - Home:
    - index.md
    - Getting started: getting-started.md
    - Architecture: architecture.md
    - Testing: testing.md
    - Benchmarks: benchmarks.md
    - Contributing: contributing.md
  - Types:
    - types/index.md
    - Core:
      - DataType: types/datatype.md
      - Field: types/field.md
      - Scalar: types/scalar.md
      - Cast: types/cast.md
      - Paths: types/paths.md
      - Protocol: types/protocol.md
    - Numeric:
      - types/numeric/index.md
      - Integer: types/numeric/integer.md
      - Floating: types/numeric/floating.md
      - Decimal: types/numeric/decimal.md
      - Boolean: types/numeric/boolean.md
    - Temporal:
      - types/temporal/index.md
      - Date: types/temporal/date.md
      - Time: types/temporal/time.md
      - Datetime: types/temporal/datetime.md
      - Duration: types/temporal/duration.md
      - Interval: types/temporal/interval.md
      - Timezone: types/temporal/timezone.md
    - Strings & bytes:
      - types/text/index.md
      - Strings: types/text/string.md
      - Bytes: types/text/bytes.md
    - Codes:
      - types/codes/index.md
      - Currency: types/codes/currency.md
      - Country: types/codes/country.md
      - MIC: types/codes/mic.md
      - CFI: types/codes/cfi.md
      - ISIN: types/codes/isin.md
      - CUSIP: types/codes/cusip.md
      - SEDOL: types/codes/sedol.md
      - Bloomberg: types/codes/bloomberg.md
      - FIGI: types/codes/figi.md
      - Side: types/codes/side.md
      - State: types/codes/state.md
      - Time in force: types/codes/timeinforce.md
    - Nested:
      - types/nested/index.md
      - Struct: types/nested/struct.md
      - List: types/nested/list.md
      - Map: types/nested/map.md
      - Union: types/nested/union.md
      - Dictionary: types/nested/dictionary.md
      - Run-end: types/nested/runend.md
    - Geospatial:
      - types/geospatial/index.md
      - Geometry: types/geospatial/geometry.md
      - Geography: types/geospatial/geography.md
    - Single types:
      - UUID: types/uuid.md
      - Version: types/version.md
      - Media types: types/mediatype.md
      - Variant: types/variant.md
      - Value stream: types/value-stream.md
    - Playground: types/playground.md
  - Holder:
    - holder/index.md
    - IOBase:
      - Bytes: holder/iobase/bytes.md
      - Calls: holder/iobase/calls.md
      - Values: holder/iobase/values.md
      - Records: holder/iobase/records.md
      - Partitions: holder/iobase/partitions.md
    - Backends:
      - Buffer: holder/backends/buffer.md
      - Local: holder/backends/local.md
      - Filesystems: holder/backends/filesystems.md
      - Object stores: holder/backends/object.md
      - Buffered: holder/backends/buffered.md
      - ZIP: holder/backends/zip.md
  - Coding:
    - coding/index.md
    - gzip: coding/gzip.md
    - zlib: coding/zlib.md
    - zstd: coding/zstd.md
  - Charset:
    - charset/index.md
    - Encodings: charset/encodings.md
    - Transcoded: charset/transcoded.md
    - Streams: charset/streams.md
  - Media:
    - media/index.md
    - Shared:
      - RecordOptions: media/options.md
      - Structured documents: media/structured.md
      - Placeholders: media/placeholders.md
    - Arrow IPC:
      - media/ipc/index.md
      - Read: media/ipc/read.md
      - Write: media/ipc/write.md
      - Options: media/ipc/options.md
      - Column pushdown: media/ipc/pushdown.md
    - Apache Parquet:
      - media/parquet/index.md
      - Read: media/parquet/read.md
      - Write: media/parquet/write.md
      - Column pushdown: media/parquet/pushdown.md
      - Compression: media/parquet/compression.md
      - Footer: media/parquet/footer.md
    - Apache Avro:
      - media/avro/index.md
      - Read: media/avro/read.md
      - Write: media/avro/write.md
      - Schemas: media/avro/schemas.md
      - Blocks: media/avro/blocks.md
    - Plain text:
      - media/text/index.md
      - Read: media/text/read.md
      - Write: media/text/write.md
      - Lines: media/text/lines.md
      - Options: media/text/options.md
    - JSON:
      - media/json/index.md
      - Read: media/json/read.md
      - Write: media/json/write.md
      - Values: media/json/values.md
    - YAML:
      - media/yaml/index.md
      - Read: media/yaml/read.md
      - Write: media/yaml/write.md
      - Values: media/yaml/values.md
    - TOML:
      - media/toml/index.md
      - Read: media/toml/read.md
      - Write: media/toml/write.md
      - Values: media/toml/values.md
    - Iceberg:
      - media/iceberg/index.md
      - Read: media/iceberg/read.md
      - Write: media/iceberg/write.md
      - Metadata: media/iceberg/metadata.md
      - Partitions: media/iceberg/partitions.md
      - Schemas: media/iceberg/schema.md
      - Catalog: media/iceberg/catalog.md
  - URI:
    - uri/index.md
    - Path: uri/path.md
    - URL and URN: uri/url-urn.md
    - ARN: uri/arn.md
    - Query parameters: uri/parameters.md
    - Patterns: uri/patterns.md
  - Arrow:
    - arrow/index.md
    - Scalars: arrow/scalars.md
    - Values: arrow/values.md
    - Schema: arrow/schema.md
    - Readers: arrow/readers.md
  - Expression:
    - expression/index.md
    - Grammar: expression/grammar.md
    - Terms: expression/terms.md
    - Selectors: expression/selectors.md
    - Filters: expression/filters.md
    - Functions: expression/functions.md
    - Plans: expression/plans.md
    - Holder attributes: expression/holder.md
    - Evaluate: expression/evaluate.md
  - Hashing: hashing.md
  - Graph: graph.md
  - FIX:
    - fix/index.md
    - Explorer: fix/explorer.md
    - Decode: fix/decode.md
    - Encode: fix/encode.md
    - Registry: fix/registry.md
    - Store: fix/store.md
    - Message: fix/message.md
    - Arrow: fix/arrow.md
    - Capture: fix/capture.md
    - Lifecycle: fix/lifecycle.md
    - CLI: fix/cli.md

validation:
  links:
    anchors: warn
    absolute_links: warn
    not_found: warn
    unrecognized_links: warn
  nav:
    absolute_links: warn
    not_found: warn
    omitted_files: warn

copyright: Copyright &copy; Yggdryl contributors
