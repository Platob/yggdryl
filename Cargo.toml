# The repository workspace: the Rust core plus the two native extensions.
#
# Each member keeps its own manifest; shared versions, dependency pins, and
# lints live here so the core and the bindings cannot drift apart.
[workspace]
resolver = "3"
members = ["rust", "python", "node", "cli"]
# Root commands target the Rust source of truth. Bindings remain explicit
# workspace members and are selected with `--workspace` or their own tools.
default-members = ["rust"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/platob/yggdryl"

[workspace.dependencies]
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-cast = "59.2.0"
arrow-data = "59.2.0"
arrow-ipc = "59.2.0"
arrow-ord = "59.2.0"
arrow-pyarrow = "59.2.0"
arrow-row = "59.2.0"
arrow-schema = { version = "59.2.0", features = ["ffi"] }
arrow-select = "59.2.0"
base64 = "0.23"
half = "2.7"
# The logging facade. Nothing is emitted unless the host installs a logger,
# so a library build pays one atomic load per record site and nothing else.
log = "0.4"
napi = { version = "3.12.1", default-features = false, features = ["napi8"] }
napi-build = "2.4.1"
napi-derive = "3.6.3"
pyo3 = { version = "0.29.2", features = ["extension-module"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep file/line backtraces for workspace code while avoiding the bulk of
# full symbols and third-party debug information in local builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = 0

# Opt into full debugger symbols only when a debugging session needs them.
[profile.debugging]
inherits = "dev"
debug = 2
