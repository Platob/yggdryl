[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "yggdryl"
version = "0.1.22"
description = "Native Yggdryl schemas, dataclass field definitions, identifiers, and byte codecs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = [
  "pyarrow>=18",
  "typing_extensions>=4.4; python_version < '3.11'",
]

[project.optional-dependencies]
# `pandas` and `polars` are the two frame libraries the typed frame entry points
# convert, and neither is a runtime dependency: they are installed here so the
# tests and the documentation examples that exercise that boundary can run.
# `tzdata` supplies the zone database on a platform whose Python has none.
test = [
  "mypy>=1.15",
  "pandas>=2",
  "polars>=1",
  "pytest>=8",
  "tzdata",
]

[tool.maturin]
bindings = "pyo3"
# Two stable-ABI families serve every CPython, so a platform builds once per
# family rather than once per interpreter: abi3 from 3.11 for every
# GIL-enabled CPython, and abi3t from 3.15 for GIL-enabled and free-threaded
# CPython alike (PEP 803, `_native.abi3t.so`, tagged `cp315-abi3.abi3t`).
# 3.11 is the abi3 floor because the buffer protocol (`pyo3::buffer`) joined
# the limited API there, so 3.10 builds an extension of its own; a
# free-threaded 3.14 has no stable ABI, so it builds a version-specific
# extension too (`cp314-cp314t`), PyO3 ignoring abi3 there; PyO3 0.29 builds
# for no free-threaded CPython below 3.14 (`pyo3-ffi`'s
# `MIN_FREE_THREADED_VERSION`), so there is no `cp313-cp313t`. One maturin build
# picks one family by the interpreter it targets, which is why the release
# builds twice per platform (`.github/workflows/release.yml`). The features are
# conditional here rather than set in Cargo.toml so a 3.10 interpreter builds
# without them: a feature set in the manifest would put the 3.11 build in a
# wheel tagged for 3.10.
features = [
  { feature = "pyo3/abi3-py311", python-version = ">=3.11" },
  { feature = "pyo3/abi3t-py315", python-version = ">=3.15" },
]
# The `yggdryl` command ships in the same wheel as the extension module. maturin
# copies this directory's `scripts/` into `yggdryl-<version>.data/scripts/`,
# which an installer puts straight on PATH - so `pip install yggdryl` answers
# `yggdryl` with the compiled binary rather than a Python launcher wrapping one.
#
# maturin copies; it does not build. `scripts/stage_cli.py` is what puts the
# binary here, and it must run before maturin does. The directory is committed
# holding nothing, because maturin refuses a `data` that is not there while an
# empty one builds a wheel with no scripts - which is exactly what a
# contributor who only wants the extension module should get.
data = "wheel-data"
exclude = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.pyc",
  # The placeholder holds `scripts/` open for git, and for a source
  # distribution someone builds a wheel from - which hits the same missing
  # directory check. Nobody installing needs it on PATH, so it is dropped from
  # the wheel alone.
  { path = "wheel-data/scripts/.gitkeep", format = "wheel" },
  # The staged binary is native to the machine that built it, so a source
  # distribution never carries one.
  { path = "wheel-data/scripts/yggdryl*", format = "sdist" },
]
module-name = "yggdryl._native"
python-source = "."
strip = true

[tool.pytest.ini_options]
# The Spark interop suite is opt-in: it needs a JVM, pyspark, and the
# iceberg-spark-runtime jar (scripts/setup_spark_interop.py provisions them),
# so the default run deselects it. `pytest -m spark_interop` runs it, because
# a -m given on the command line overrides the one added here.
addopts = ["--import-mode=importlib", "-m", "not spark_interop"]
markers = [
  "spark_interop: exchanges Iceberg tables with Apache Spark; provisioned by scripts/setup_spark_interop.py",
]
testpaths = ["tests"]

[tool.mypy]
plugins = ["yggdryl.mypy"]
