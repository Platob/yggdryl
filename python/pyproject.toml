[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "yggdryl"
version = "0.1.1"
description = "Native Yggdryl schemas, dataclass field definitions, identifiers, and byte codecs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = [
  "pyarrow>=18",
  "typing_extensions>=4.4; python_version < '3.11'",
]

[project.optional-dependencies]
# `pandas` and `polars` are the two frame libraries the typed frame entry points
# convert, and neither is a runtime dependency: they are installed here so the
# tests and the documentation examples that exercise that boundary can run.
# `tzdata` supplies the zone database on a platform whose Python has none.
test = [
  "mypy>=1.15",
  "pandas>=2",
  "polars>=1",
  "pytest>=8",
  "tzdata",
]

[tool.maturin]
bindings = "pyo3"
# The `ygg` command ships in the same wheel as the extension module. maturin
# copies this directory's `scripts/` into `yggdryl-<version>.data/scripts/`,
# which an installer puts straight on PATH - so `pip install yggdryl` answers
# `ygg` with the compiled binary rather than a Python launcher wrapping one.
#
# maturin copies; it does not build. `scripts/stage_cli.py` is what puts the
# binary here, and it must run before maturin does. The directory is committed
# holding nothing, because maturin refuses a `data` that is not there while an
# empty one builds a wheel with no scripts - which is exactly what a
# contributor who only wants the extension module should get.
data = "wheel-data"
exclude = [
  "**/__pycache__",
  "**/__pycache__/**",
  "**/*.pyc",
  # The placeholder holds `scripts/` open for git, and for a source
  # distribution someone builds a wheel from - which hits the same missing
  # directory check. Nobody installing needs it on PATH, so it is dropped from
  # the wheel alone.
  { path = "wheel-data/scripts/.gitkeep", format = "wheel" },
  # The staged binary is native to the machine that built it, so a source
  # distribution never carries one.
  { path = "wheel-data/scripts/ygg*", format = "sdist" },
]
module-name = "yggdryl._native"
python-source = "."
strip = true

[tool.pytest.ini_options]
# The Spark interop suite is opt-in: it needs a JVM, pyspark, and the
# iceberg-spark-runtime jar (scripts/setup_spark_interop.py provisions them),
# so the default run deselects it. `pytest -m spark_interop` runs it, because
# a -m given on the command line overrides the one added here.
addopts = ["--import-mode=importlib", "-m", "not spark_interop"]
markers = [
  "spark_interop: exchanges Iceberg tables with Apache Spark; provisioned by scripts/setup_spark_interop.py",
]
testpaths = ["tests"]

[tool.mypy]
plugins = ["yggdryl.mypy"]
