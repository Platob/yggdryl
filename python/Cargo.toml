[package]
name = "yggdryl-python"
description = "Python bindings for Yggdryl schemas, dataclass field definitions, identifiers, and byte codecs"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow-array.workspace = true
arrow-data.workspace = true
arrow-pyarrow.workspace = true
arrow-schema.workspace = true
half.workspace = true
pyo3.workspace = true
yggdryl = { path = "../rust", default-features = false, features = ["iceberg"] }
serde_json = "1"
# Bridges the core's `log` records into Python's `logging`, so a record is
# emitted where the work happens and reaches the handler the caller configured.
pyo3-log = "0.13.4"

[lints]
workspace = true
