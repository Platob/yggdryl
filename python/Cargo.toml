[package]
name = "yggdryl-python"
description = "Python bindings for Yggdryl schemas, dataclass field definitions, identifiers, and byte codecs"
version.workspace = true
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow-array.workspace = true
arrow-data.workspace = true
arrow-pyarrow.workspace = true
arrow-schema.workspace = true
half.workspace = true
# Named directly because the bridge is configured with its level filters.
log.workspace = true
pyo3.workspace = true
yggdryl = { path = "../rust", default-features = false, features = [
    "http",
    "iceberg",
    "s3",
] }
serde_json = "1"
# The extension's own allocator. Every Arrow buffer a read decodes is a
# large allocation, and the system allocator maps and unmaps those per call,
# so a scan pays a page fault per 4 KiB it decodes; mimalloc - the allocator
# PyArrow itself ships - keeps freed pages for the next batch. Only this
# binary sets it: the core crate is a library and never picks one.
mimalloc = { version = "0.1", default-features = false }
# Bridges the core's `log` records into Python's `logging`, so a record is
# emitted where the work happens and reaches the handler the caller configured.
pyo3-log = "0.13.4"

[lints]
workspace = true
