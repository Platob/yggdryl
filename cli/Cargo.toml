# `yggdryl`: the command line, one namespace per subcommand.
#
# `yggdryl fix` is everything a desk does to a FIX dictionary, from a shell,
# `yggdryl xmla serve` puts folders of record media on the wire as XML for
# Analysis catalogs, and `yggdryl market serve` puts a table of market data on the
# wire as the book display - bid and ask candles, books and audits - with a FIX
# bridge capture folded in first. Its own member rather than a binary inside the
# core, so a library consumer carries none of what a terminal needs - argument
# parsing, raw mode, colour - and the core's dependency set stays exactly what a
# schema needs.
[package]
name = "yggdryl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The yggdryl command line: manage a FIX dictionary, serve XML for Analysis catalogs and serve the book display of a market-data table (`yggdryl market serve`) from a terminal."

[[bin]]
name = "yggdryl"
path = "src/main.rs"
# The core library is `yggdryl` too, so documenting this target would write
# over the core's rustdoc (cargo#6313); its `--help` is its documentation.
doc = false

[dependencies]
# The default core plus `http`: a tool that reads a dictionary wants the same
# core a consumer has, and `yggdryl xmla serve` and `yggdryl market serve` answer on the
# core's HTTP server.
yggdryl = { path = "../rust", features = ["http"] }
# Argument parsing with derived help, so every command documents itself and
# `--help` is generated from the same declaration the parser uses.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# One crate for everything a terminal needs: colour, cursor, raw mode and key
# events. The interactive shell and the animation are written here on top of
# it rather than pulling a line editor and a spinner crate for each.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
shlex = "2.0"

[features]
# `yggdryl xmla serve` and `yggdryl market serve` over an Iceberg folder need the
# core's table reader, and `yggdryl market serve --capture` makes an empty folder a table with
# it; without it an Iceberg table is listed and refused on read, by name. The
# staged binary (`scripts/stage_cli.py`) enables it; the default build stays the
# schema-only core.
iceberg = ["yggdryl/iceberg"]

[[bench]]
name = "fix"
path = "benchmarks/fix.rs"
harness = false

[lints]
workspace = true
