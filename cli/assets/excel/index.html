<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>yggdryl workbook</title>
<link rel="icon" href="icons.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app" id="app">

<header class="titlebar">
  <svg class="icon logo" aria-hidden="true"><use href="icons.svg#logo"></use></svg>
  <div class="quick" role="toolbar" aria-label="Quick access">
    <button type="button" id="undo" data-command="undo" aria-label="Undo" aria-disabled="true" aria-keyshortcuts="Control+Z"><svg class="icon" aria-hidden="true"><use href="icons.svg#undo"></use></svg></button>
    <button type="button" id="redo" data-command="redo" aria-label="Redo" aria-disabled="true" aria-keyshortcuts="Control+Y"><svg class="icon" aria-hidden="true"><use href="icons.svg#redo"></use></svg></button>
  </div>
  <h1 class="title" id="title">yggdryl workbook</h1>
  <span class="title-state" id="title-state"></span>
</header>

<nav class="ribbon-tabs" role="tablist" aria-label="Ribbon" id="ribbon-tabs">
  <button type="button" role="tab" id="tab-file" aria-controls="panel-file" aria-selected="false" tabindex="-1" class="tab tab-file">File</button>
  <button type="button" role="tab" id="tab-home" aria-controls="panel-home" aria-selected="true" tabindex="0" class="tab">Home</button>
  <button type="button" role="tab" id="tab-insert" aria-controls="panel-insert" aria-selected="false" tabindex="-1" class="tab">Insert</button>
  <button type="button" role="tab" id="tab-formulas" aria-controls="panel-formulas" aria-selected="false" tabindex="-1" class="tab">Formulas</button>
  <button type="button" role="tab" id="tab-data" aria-controls="panel-data" aria-selected="false" tabindex="-1" class="tab">Data</button>
  <button type="button" role="tab" id="tab-view" aria-controls="panel-view" aria-selected="false" tabindex="-1" class="tab">View</button>
</nav>

<section class="ribbon" aria-label="Commands">

  <div class="panel backstage" role="tabpanel" id="panel-file" aria-labelledby="tab-file" hidden>
    <button type="button" class="big" data-command="new" aria-label="New workbook"><svg class="icon" aria-hidden="true"><use href="icons.svg#new"></use></svg><span>New</span></button>
    <button type="button" class="big" data-command="open" aria-label="Open a workbook" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="icons.svg#open"></use></svg><span>Open</span></button>
    <button type="button" class="big" data-command="save" aria-label="Save"><svg class="icon" aria-hidden="true"><use href="icons.svg#save"></use></svg><span>Save</span></button>
    <button type="button" class="big" data-command="saveAs" aria-label="Save as" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="icons.svg#save-as"></use></svg><span>Save As</span></button>
    <button type="button" class="big" data-command="download" aria-label="Download a copy"><svg class="icon" aria-hidden="true"><use href="icons.svg#download"></use></svg><span>Download</span></button>
  </div>

  <div class="panel" role="tabpanel" id="panel-home" aria-labelledby="tab-home">
    <div class="group" role="group" aria-labelledby="g-clipboard">
      <div class="group-body">
        <button type="button" class="big" data-command="paste" aria-label="Paste"><svg class="icon" aria-hidden="true"><use href="icons.svg#paste"></use></svg><span>Paste</span></button>
        <button type="button" class="drop" data-command="pasteMenu" aria-label="Paste options" aria-haspopup="menu" aria-expanded="false"><svg class="icon chevron" aria-hidden="true"><use href="icons.svg#chevron"></use></svg></button>
        <div class="stack">
          <button type="button" data-command="cut" aria-label="Cut"><svg class="icon" aria-hidden="true"><use href="icons.svg#cut"></use></svg></button>
          <button type="button" data-command="copy" aria-label="Copy"><svg class="icon" aria-hidden="true"><use href="icons.svg#copy"></use></svg></button>
          <button type="button" data-command="formatPainter" aria-label="Format Painter" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#painter"></use></svg></button>
        </div>
      </div>
      <div class="group-label" id="g-clipboard">Clipboard</div>
    </div>

    <div class="group" role="group" aria-labelledby="g-font">
      <div class="group-body rows">
        <div class="row">
          <select class="font-name" data-command="fontName" aria-label="Font">
            <option>Calibri</option><option>Aptos</option><option>Arial</option><option>Cambria</option>
            <option>Consolas</option><option>Courier New</option><option>Georgia</option><option>Segoe UI</option>
            <option>Tahoma</option><option>Times New Roman</option><option>Verdana</option>
          </select>
          <select class="font-size" data-command="fontSize" aria-label="Font size">
            <option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option>
            <option>14</option><option>16</option><option>18</option><option>20</option><option>24</option>
            <option>28</option><option>36</option><option>48</option><option>72</option>
          </select>
        </div>
        <div class="row">
          <button type="button" data-command="bold" aria-label="Bold" aria-pressed="false" aria-keyshortcuts="Control+B"><svg class="icon" aria-hidden="true"><use href="icons.svg#bold"></use></svg></button>
          <button type="button" data-command="italic" aria-label="Italic" aria-pressed="false" aria-keyshortcuts="Control+I"><svg class="icon" aria-hidden="true"><use href="icons.svg#italic"></use></svg></button>
          <button type="button" data-command="underline" aria-label="Underline" aria-pressed="false" aria-keyshortcuts="Control+U"><svg class="icon" aria-hidden="true"><use href="icons.svg#underline"></use></svg></button>
          <button type="button" data-command="strike" aria-label="Strikethrough" aria-pressed="false" aria-keyshortcuts="Control+5"><svg class="icon" aria-hidden="true"><use href="icons.svg#strike"></use></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" data-command="bordersMenu" aria-label="Borders" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#borders"></use></svg><svg class="icon chevron" aria-hidden="true"><use href="icons.svg#chevron"></use></svg></button>
          <button type="button" data-command="fillMenu" aria-label="Fill colour" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#fill"></use></svg><svg class="icon chevron" aria-hidden="true"><use href="icons.svg#chevron"></use></svg></button>
          <button type="button" data-command="fontColorMenu" aria-label="Font colour" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#font-color"></use></svg><svg class="icon chevron" aria-hidden="true"><use href="icons.svg#chevron"></use></svg></button>
        </div>
      </div>
      <div class="group-label" id="g-font">Font</div>
    </div>

    <div class="group" role="group" aria-labelledby="g-alignment">
      <div class="group-body rows">
        <div class="row">
          <button type="button" data-command="alignTop" aria-label="Top align" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-top"></use></svg></button>
          <button type="button" data-command="alignMiddle" aria-label="Middle align" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-middle"></use></svg></button>
          <button type="button" data-command="alignBottom" aria-label="Bottom align" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-bottom"></use></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" data-command="wrap" aria-label="Wrap text" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#wrap"></use></svg></button>
        </div>
        <div class="row">
          <button type="button" data-command="alignLeft" aria-label="Align left" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-left"></use></svg></button>
          <button type="button" data-command="alignCenter" aria-label="Center" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-center"></use></svg></button>
          <button type="button" data-command="alignRight" aria-label="Align right" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#align-right"></use></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" data-command="indentLess" aria-label="Decrease indent"><svg class="icon" aria-hidden="true"><use href="icons.svg#indent-less"></use></svg></button>
          <button type="button" data-command="indentMore" aria-label="Increase indent"><svg class="icon" aria-hidden="true"><use href="icons.svg#indent-more"></use></svg></button>
          <button type="button" data-command="mergeMenu" aria-label="Merge and center" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#merge"></use></svg><svg class="icon chevron" aria-hidden="true"><use href="icons.svg#chevron"></use></svg></button>
        </div>
      </div>
      <div class="group-label" id="g-alignment">Alignment</div>
    </div>

    <div class="group" role="group" aria-labelledby="g-number">
      <div class="group-body rows">
        <div class="row">
          <select class="number-format" data-command="numberFormat" aria-label="Number format">
            <option value="custom" hidden disabled>Custom</option>
            <option value="general">General</option>
            <option value="number">Number</option>
            <option value="currency">Currency</option>
            <option value="accounting">Accounting</option>
            <option value="shortDate">Short Date</option>
            <option value="longDate">Long Date</option>
            <option value="time">Time</option>
            <option value="percentage">Percentage</option>
            <option value="fraction">Fraction</option>
            <option value="scientific">Scientific</option>
            <option value="text">Text</option>
            <option value="more">More Number Formats…</option>
          </select>
        </div>
        <div class="row">
          <button type="button" data-command="currency" aria-label="Accounting number format"><svg class="icon" aria-hidden="true"><use href="icons.svg#currency"></use></svg></button>
          <button type="button" data-command="percent" aria-label="Percent style"><svg class="icon" aria-hidden="true"><use href="icons.svg#percent"></use></svg></button>
          <button type="button" data-command="comma" aria-label="Comma style"><svg class="icon" aria-hidden="true"><use href="icons.svg#comma"></use></svg></button>
          <button type="button" data-command="decimalsMore" aria-label="Increase decimal"><svg class="icon" aria-hidden="true"><use href="icons.svg#decimals-more"></use></svg></button>
          <button type="button" data-command="decimalsLess" aria-label="Decrease decimal"><svg class="icon" aria-hidden="true"><use href="icons.svg#decimals-less"></use></svg></button>
        </div>
      </div>
      <div class="group-label" id="g-number">Number</div>
    </div>

    <div class="group" role="group" aria-labelledby="g-cells">
      <div class="group-body">
        <button type="button" class="big" data-command="insertMenu" aria-label="Insert cells" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#insert"></use></svg><span>Insert</span></button>
        <button type="button" class="big" data-command="deleteMenu" aria-label="Delete cells" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#delete"></use></svg><span>Delete</span></button>
        <button type="button" class="big" data-command="formatMenu" aria-label="Format cells" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#format"></use></svg><span>Format</span></button>
      </div>
      <div class="group-label" id="g-cells">Cells</div>
    </div>

    <div class="group" role="group" aria-labelledby="g-editing">
      <div class="group-body">
        <div class="stack">
          <button type="button" data-command="autoSumMenu" aria-label="AutoSum" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#autosum"></use></svg><span>AutoSum</span></button>
          <button type="button" data-command="fillMenu2" aria-label="Fill" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#fill-down"></use></svg><span>Fill</span></button>
          <button type="button" data-command="clearMenu" aria-label="Clear" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#clear"></use></svg><span>Clear</span></button>
        </div>
        <button type="button" class="big" data-command="sortMenu" aria-label="Sort" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#sort"></use></svg><span>Sort</span></button>
        <button type="button" class="big" data-command="findMenu" aria-label="Find and select" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#find"></use></svg><span>Find</span></button>
      </div>
      <div class="group-label" id="g-editing">Editing</div>
    </div>
  </div>

  <div class="panel" role="tabpanel" id="panel-insert" aria-labelledby="tab-insert" hidden>
    <div class="group" role="group" aria-labelledby="g-tables">
      <div class="group-body">
        <button type="button" class="big" data-command="pivotTable" aria-label="Insert PivotTable"><svg class="icon" aria-hidden="true"><use href="icons.svg#pivot"></use></svg><span>PivotTable</span></button>
      </div>
      <div class="group-label" id="g-tables">Tables</div>
    </div>
  </div>

  <div class="panel" role="tabpanel" id="panel-formulas" aria-labelledby="tab-formulas" hidden>
    <div class="group" role="group" aria-labelledby="g-library">
      <div class="group-body">
        <button type="button" class="big" data-command="insertFunction" aria-label="Insert function" aria-haspopup="dialog" aria-keyshortcuts="Shift+F3"><svg class="icon" aria-hidden="true"><use href="icons.svg#function"></use></svg><span>Insert Function</span></button>
        <button type="button" class="big" data-command="autoSum" aria-label="AutoSum"><svg class="icon" aria-hidden="true"><use href="icons.svg#autosum"></use></svg><span>AutoSum</span></button>
      </div>
      <div class="group-label" id="g-library">Function Library</div>
    </div>
    <div class="group" role="group" aria-labelledby="g-calculation">
      <div class="group-body">
        <button type="button" class="big" data-command="calculate" aria-label="Calculate now"><svg class="icon" aria-hidden="true"><use href="icons.svg#calculate"></use></svg><span>Calculate Now</span></button>
      </div>
      <div class="group-label" id="g-calculation">Calculation</div>
    </div>
  </div>

  <div class="panel" role="tabpanel" id="panel-data" aria-labelledby="tab-data" hidden>
    <div class="group" role="group" aria-labelledby="g-get">
      <div class="group-body">
        <button type="button" class="big" data-command="getData" aria-label="Get data" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="icons.svg#get-data"></use></svg><span>Get Data</span></button>
        <button type="button" class="big" data-command="refreshAll" aria-label="Refresh all pivot tables"><svg class="icon" aria-hidden="true"><use href="icons.svg#refresh"></use></svg><span>Refresh All</span></button>
      </div>
      <div class="group-label" id="g-get">Get &amp; Transform</div>
    </div>
    <div class="group" role="group" aria-labelledby="g-sort">
      <div class="group-body">
        <div class="stack">
          <button type="button" data-command="sortAscending" aria-label="Sort A to Z"><svg class="icon" aria-hidden="true"><use href="icons.svg#sort-asc"></use></svg><span>A→Z</span></button>
          <button type="button" data-command="sortDescending" aria-label="Sort Z to A"><svg class="icon" aria-hidden="true"><use href="icons.svg#sort-desc"></use></svg><span>Z→A</span></button>
        </div>
        <button type="button" class="big" data-command="sortDialog" aria-label="Sort" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="icons.svg#sort"></use></svg><span>Sort…</span></button>
      </div>
      <div class="group-label" id="g-sort">Sort</div>
    </div>
  </div>

  <div class="panel" role="tabpanel" id="panel-view" aria-labelledby="tab-view" hidden>
    <div class="group" role="group" aria-labelledby="g-window">
      <div class="group-body">
        <button type="button" class="big" data-command="freezeMenu" aria-label="Freeze panes" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="icons.svg#freeze"></use></svg><span>Freeze Panes</span></button>
      </div>
      <div class="group-label" id="g-window">Window</div>
    </div>
    <div class="group" role="group" aria-labelledby="g-show">
      <div class="group-body">
        <button type="button" class="big" data-command="gridlines" aria-label="Gridlines" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="icons.svg#gridlines"></use></svg><span>Gridlines</span></button>
      </div>
      <div class="group-label" id="g-show">Show</div>
    </div>
    <div class="group" role="group" aria-labelledby="g-zoom">
      <div class="group-body rows">
        <div class="row">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#zoom"></use></svg>
          <select data-command="zoom" aria-label="Zoom" id="zoom">
            <option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option>
            <option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
            <option value="2">200%</option><option value="3">300%</option><option value="4">400%</option>
          </select>
        </div>
      </div>
      <div class="group-label" id="g-zoom">Zoom</div>
    </div>
  </div>
</section>

<div class="formula-row">
  <input class="namebox" id="namebox" aria-label="Name Box" value="A1" autocomplete="off" spellcheck="false">
  <button type="button" class="fx" data-command="insertFunction" aria-label="Insert function" aria-haspopup="dialog" aria-keyshortcuts="Shift+F3" title="Insert Function (Shift+F3)"><svg class="icon" aria-hidden="true"><use href="icons.svg#function"></use></svg></button>
  <textarea class="formula" id="formula" aria-label="Formula Bar" rows="1" autocomplete="off" spellcheck="false"></textarea>
</div>

<main class="workspace">
  <div class="grid" id="grid">
    <canvas class="grid-canvas" id="grid-canvas" aria-hidden="true"></canvas>
    <div class="scrollbar vertical" id="vscroll" role="scrollbar" aria-orientation="vertical" aria-controls="grid-mirror" aria-label="Rows" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0"><div class="thumb"></div></div>
  </div>
  <div class="sheetbar">
    <div class="sheet-nav">
      <button type="button" data-command="sheetsBack" aria-label="Scroll sheet tabs left"><svg class="icon" aria-hidden="true"><use href="icons.svg#previous"></use></svg></button>
      <button type="button" data-command="sheetsForward" aria-label="Scroll sheet tabs right"><svg class="icon" aria-hidden="true"><use href="icons.svg#next"></use></svg></button>
    </div>
    <div class="sheet-tabs" id="sheet-tabs" role="tablist" aria-label="Sheets"></div>
    <button type="button" class="sheet-add" data-command="addSheet" aria-label="New sheet"><svg class="icon" aria-hidden="true"><use href="icons.svg#plus"></use></svg></button>
    <div class="scrollbar horizontal" id="hscroll" role="scrollbar" aria-orientation="horizontal" aria-controls="grid-mirror" aria-label="Columns" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0"><div class="thumb"></div></div>
  </div>
</main>

<footer class="statusbar" id="statusbar" aria-label="Status bar" data-mode="ready" data-summary="none">
  <span class="status-mode" id="status-mode">Ready</span>
  <span class="status-note" id="status-note"></span>
  <button type="button" class="status-button" id="status-calculate" hidden>Calculate</button>
  <button type="button" class="status-button status-circular" id="status-circular" hidden></button>
  <span class="status-fill"></span>
  <span class="status-aggregates" id="status-aggregates" title="Right-click to choose what shows"></span>
  <span class="status-clock" id="status-clock"></span>
  <span class="status-saved" id="status-saved"></span>
  <div class="status-zoom-group" role="group" aria-label="Zoom">
    <button type="button" class="status-button" id="status-zoom-out" aria-label="Zoom out">−</button>
    <input type="range" class="status-slider" id="status-zoom-slider" min="0" max="100" step="1" value="50" aria-label="Zoom" aria-valuetext="100%">
    <button type="button" class="status-button" id="status-zoom-in" aria-label="Zoom in">+</button>
    <span class="status-zoom" id="status-zoom">100%</span>
  </div>
</footer>

<div class="toasts" id="toasts"></div>
</div>

</body>
</html>
