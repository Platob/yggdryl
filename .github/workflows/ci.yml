name: CI

on:
  # A feature-branch push with an open PR already emits `pull_request`'s
  # synchronize event. Restricting `push` to main keeps one CI run per change.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A pull request supersedes itself: pushing to the branch makes the run still
# testing the replaced commit worthless, so it is cancelled. A push to `main`
# supersedes nothing - every commit there is a tip somebody releases from, and
# it is the only run that will ever test it - so each is grouped by its own SHA
# and runs to completion. Both used to share `github.ref`, which put every
# `main` push in one group under `cancel-in-progress: true`: the next merge
# killed the previous merge's CI, and 24 of the last 100 `main` runs died that
# way, 17 to 54 seconds after the following push arrived. `docs.yml` already
# draws this distinction; this is CI catching up with it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# The core is built first and every job that reuses it fans out behind it.
#
# `changes` plans the run from `.github/ci/rows.toml`, which says what each
# job reads: a push to `main` runs every job, a pull request the jobs its
# change can reach (`scripts/ci/plan.py`). A core lane - `core-default`,
# `core-full`, `core-interop` - compiles the core once for one feature set
# and hands what it compiled to the jobs of that feature set
# (`.github/actions/rust-lane`), so a test shard or an exchange compiles its
# own targets and never the core again. A job needs only what it reuses: the
# jobs that build in place under a feature set no lane compiles - the wheels,
# the CLI, the addon, the Rust examples, the leaf crates - start at once on
# their dependency caches. `ci` - "CI result" - judges the run against the
# plan, and is the one check to require.
#
# Every job but `changes` and `ci` asks the plan for its own name, framed
# in spaces, and writes `needs:` as a flow list: the planner reads both and
# refuses a workflow that drifts from `rows.toml`. The plan carries every
# need of a planned job, so no `if:` asks for a need's result: a need that
# fails skips its dependents, and the gate names each as planned and skipped.
jobs:
  changes:
    # The plan, and the one toolchain every Rust job of the run installs. The
    # planner's own tests run first: a plan that answers wrong skips a proof
    # silently, and the gate, which reads the plan, would agree with it.
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      toolchain: ${{ steps.toolchain.outputs.version }}
      jobs: ${{ steps.plan.outputs.jobs }}
      core_shards: ${{ steps.plan.outputs.core_shards }}
      leaves: ${{ steps.plan.outputs.leaves }}
      python_legs: ${{ steps.plan.outputs.python_legs }}
      proof: ${{ steps.plan.outputs.proof }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base it merged onto: the change is read against that.
          fetch-depth: 2
      - name: Resolve the run's toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          echo "version=$(rustc +stable --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the ledger of rows this pull request already proved
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-ledger
          key: ci-ledger-${{ github.run_id }}
          restore-keys: ci-ledger-
      - name: Test the planner
        run: python3 -m unittest discover -s scripts/tests -p test_ci_plan.py
      - name: Plan the run
        id: plan
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/ci/plan.py plan

  fmt:
    name: Rust format
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' fmt ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check

  lint-default:
    # The default lane selects only the core, otherwise the bindings would
    # unify Parquet and Iceberg into it.
    name: Rust lint (default features)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' lint-default ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: lint-default
          save: "true"
          components: clippy
      - name: Clippy
        run: cargo clippy --locked -p yggdryl --all-targets --no-deps -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p yggdryl --no-deps
      - name: Check optimized benchmark configuration
        run: cargo check --locked -p yggdryl --profile bench --benches

  lint-full:
    # The full lane also lints binding Rust: every member under every feature.
    name: Rust lint (all features)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' lint-full ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: lint-full
          save: "true"
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Check optimized benchmark configuration
        run: cargo check --locked -p yggdryl --profile bench --benches --all-features

  iceberg-msrv:
    name: Iceberg Rust 1.94
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' iceberg-msrv ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The workspace's one declared MSRV: the core, its tests and the
      # official Iceberg boundary all build at it.
      - name: Install the declared MSRV
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check the core and the official Iceberg boundary at the declared MSRV
        run: cargo +1.94.0 check --locked --manifest-path rust/Cargo.toml -p yggdryl --all-targets --features iceberg

  core-default:
    # The core on default features, compiled first. It builds the library
    # every default-feature test target links and the `interop` target the
    # ZIP, Avro and Excel drivers run, and hands both on as `lane-default`:
    # each shard then compiles only its own targets, and the three exchanges
    # compile nothing.
    name: Core build (default features)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' core-default ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-default
          save: "true"
      - name: Build the core and the interop target
        run: cargo test --locked -p yggdryl --no-run --test interop
      - uses: ./.github/actions/rust-lane
        with:
          mode: pack
          lane: default

  core-full:
    # The core under every feature, compiled first and handed on as
    # `lane-full`. `docs_index` is the smallest target that makes cargo build
    # the library as every test target links it.
    name: Core build (all features)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' core-full ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          save: "true"
      - name: Build the core under every feature
        run: cargo test --locked -p yggdryl --all-features --no-run --test docs_index
      - uses: ./.github/actions/rust-lane
        with:
          mode: pack
          lane: full

  core-interop:
    # The Rust half of the four exchanges that need a feature, compiled once
    # with each driver's own invocation - `--features s3` for S3, Azure and
    # Google, `parquet iceberg` from `rust/` for PyIceberg - so the jobs that
    # start the servers compile nothing. The full lane's cache is the one
    # with `s3` and Iceberg compiled; this job only reads it.
    name: Core build (exchange features)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' core-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
      - name: Build the S3, Azure and Google exchanges' Rust half
        run: cargo test --locked --manifest-path rust/Cargo.toml --features s3 --test interop --no-run
      - name: Build the PyIceberg exchange's Rust half
        working-directory: rust
        run: cargo test --locked --features "parquet iceberg" --test interop --no-run
      - uses: ./.github/actions/rust-lane
        with:
          mode: pack
          lane: interop

  core-tests-default:
    # `cargo test --all-targets` on default features, one shard per job:
    # `.github/ci/rows.toml` names the heavy targets, `rest` is every other,
    # and `scripts/ci/plan.py targets` refuses a shard set whose union is not
    # `--all-targets`. Each shard links the default lane's core.
    name: Core tests (default features, ${{ matrix.shard }})
    needs: [changes, core-default]
    if: contains(needs.changes.outputs.jobs, ' core-tests-default ')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.core_shards).default }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-default
          lane: default
      - name: Tests and benchmark smoke tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/ci/plan.py targets yggdryl default "$SHARD" > "$RUNNER_TEMP/targets"
          mapfile -t targets < "$RUNNER_TEMP/targets"
          cargo test --locked -p yggdryl --no-fail-fast "${targets[@]}"
      # `--all-targets` is `--lib --bins --examples --tests --benches`, and
      # doctests are none of those: the step above has never compiled one.
      # They are the examples the published API pages carry, so they are the
      # examples most read and least run - 190 of them on default features.
      - name: Rustdoc examples
        if: matrix.shard == 'rest'
        run: cargo test --locked -p yggdryl --doc

  core-tests-full:
    name: Core tests (all features, ${{ matrix.shard }})
    needs: [changes, core-full]
    if: contains(needs.changes.outputs.jobs, ' core-tests-full ')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.core_shards).full }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          lane: full
      - name: Tests and benchmark smoke tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 scripts/ci/plan.py targets yggdryl full "$SHARD" > "$RUNNER_TEMP/targets"
          mapfile -t targets < "$RUNNER_TEMP/targets"
          cargo test --locked -p yggdryl --all-features --no-fail-fast "${targets[@]}"
      - name: Rustdoc examples
        if: matrix.shard == 'rest'
        run: cargo test --locked -p yggdryl --doc --all-features

  pyiceberg-interop:
    name: PyIceberg exchange
    needs: [changes, core-interop]
    if: contains(needs.changes.outputs.jobs, ' pyiceberg-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          lane: interop
      - name: Install the external implementation
        run: python -m pip install "pyiceberg[pyarrow,sql-sqlite]==0.11.1" "pyarrow==25.0.1"
      - name: Exchange v1, v2, and v3 tables
        run: python scripts/check_iceberg_interop.py

  object-interop:
    # The S3 exchange with MinIO, cross-checked by boto3. A hand-written fake
    # store proves the client agrees with itself; this proves it agrees with a
    # real implementation, in both directions, on the keys a URL and a
    # signature spell differently. MinIO is downloaded by the script, so the
    # job provisions nothing of its own.
    name: S3 exchange
    needs: [changes, core-interop]
    if: contains(needs.changes.outputs.jobs, ' object-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The driver runs the `interop` target with `--features s3`, which the
      # exchange lane built; this job used to compile the crate and the whole
      # signed-HTTPS stack itself.
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          lane: interop
      - name: Install the reference client
        run: python -m pip install "boto3>=1.34"
      - name: Exchange objects with MinIO and boto3
        run: python scripts/check_object_interop.py

  azure-interop:
    # The Azure exchange with Azurite, cross-checked by azure-storage-blob.
    # Azurite is the server that matters most for this store: it recomputes the
    # Shared Key StringToSign exactly as the service does and answers 403 for
    # anything that does not match, so a signature built wrong here is a
    # failure rather than an agreement between two halves of one mistake. The
    # script installs Azurite with npm, so the job provisions nothing itself.
    name: Azure exchange
    needs: [changes, core-interop]
    if: contains(needs.changes.outputs.jobs, ' azure-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          lane: interop
      - name: Install the reference client
        run: python -m pip install "azure-storage-blob>=12"
      - name: Exchange blobs with Azurite and azure-storage-blob
        run: python scripts/check_azure_interop.py

  gcs-interop:
    # The Google exchange with fake-gcs-server, cross-checked by
    # google-cloud-storage. The emulator checks the shape of every request -
    # the /storage/v1 paths, the name escaped into one segment, alt=media, the
    # multipart/related framing, the resumable protocol's Content-Range and 308
    # answers - and accepts any bearer token, so this lane proves the dialect
    # and not the identity. The script fetches the emulator's published build.
    name: Google exchange
    needs: [changes, core-interop]
    if: contains(needs.changes.outputs.jobs, ' gcs-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
          lane: interop
      - name: Install the reference client
        run: python -m pip install "google-cloud-storage>=2"
      - name: Exchange objects with fake-gcs-server and google-cloud-storage
        run: python scripts/check_gcs_interop.py

  zip-interop:
    # The ZIP exchange with Python's `zipfile`, from the standard library.
    #
    # `rust/tests/interop/zip.rs` is not feature-gated, so every Rust lane
    # already runs it - and its three reading tests report `ok` having
    # asserted nothing, because the archive `zipfile` writes is not there and
    # the halves print `SKIPPED` and return. Only this driver produces that
    # archive, and only it fails on the word. Until this job existed, the
    # reading side of the ZIP backend had never once executed under CI.
    name: ZIP exchange
    needs: [changes, core-default]
    if: contains(needs.changes.outputs.jobs, ' zip-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The driver runs the `interop` target on default features, which the
      # default lane built.
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-default
          lane: default
      - name: Exchange archives with zipfile
        run: python scripts/check_zip_interop.py

  avro-interop:
    # The Avro exchange with fastavro, and - when the probe builds - with the
    # `apache-avro` crate. Same shape as the ZIP job and the same reason:
    # `rust/tests/interop/avro.rs` is ungated, so its reading half has been
    # reporting `ok` in every lane while skipping for want of the container
    # fastavro writes. The driver writes it and refuses the skip.
    #
    # fastavro is a checking tool of the script, never a dependency of the
    # crate; the `apache-avro` probe is a scratch project the script writes
    # outside the workspace, and a build failure there is reported and
    # tolerated rather than failing the job.
    name: Avro exchange
    needs: [changes, core-default]
    if: contains(needs.changes.outputs.jobs, ' avro-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-default
          lane: default
      - name: Install the reference implementation
        run: python -m pip install fastavro
      - name: Exchange containers with fastavro
        run: python scripts/check_avro_interop.py

  excel-interop:
    # The Excel exchange with openpyxl, the reference most spreadsheets are
    # produced with in Python. Same shape as the Avro job and the same
    # reason: `rust/tests/interop/excel.rs` is ungated, so its reading half
    # reports `ok` in every lane while skipping for want of the workbooks
    # openpyxl writes. The driver writes them and refuses the skip.
    #
    # openpyxl is a checking tool of the script, never a dependency of the
    # crate.
    name: Excel exchange
    needs: [changes, core-default]
    if: contains(needs.changes.outputs.jobs, ' excel-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-lane
        with:
          mode: restore
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-default
          lane: default
      - name: Install the reference implementation
        run: python -m pip install openpyxl
      - name: Exchange workbooks with openpyxl
        run: python scripts/check_excel_interop.py

  python-wheel:
    # The command and the extension link the core under the binding's own
    # features and PyO3's `abi3`, which no lane compiles, so the wheel builds
    # in place over its own dependency cache, saved on `main`.
    name: Python binding wheel
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' python-wheel ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: python
          save: "true"
      - name: Install Maturin
        run: python -m pip install "maturin>=1.15,<2"
      # maturin copies python/wheel-data/ into the wheel and builds no binary
      # of its own, so the command is staged before the wheel is built.
      #
      # Both are debug builds. CI never measures (the release workflow builds
      # what ships), and `release` compiles the core and the extension at
      # `codegen-units = 1` behind a cache that holds only dev artifacts: on a
      # 4-core machine that was 10.5 minutes for the extension alone, plus the
      # release CLI, against about 2 minutes for both in debug over the
      # `stable-full` cache. The suites downstream pay roughly a minute more
      # at runtime (1620 tests: 27 s release, 89 s debug) and start ~10
      # minutes sooner.
      - name: Stage the yggdryl command
        run: python scripts/stage_cli.py --debug --locked
      - name: Build wheel
        run: maturin build --locked --profile dev --manifest-path python/Cargo.toml --interpreter python --out python/dist
      # Nothing else fails when staging is skipped - the wheel just quietly
      # loses the command - so the contract is asserted rather than trusted.
      - name: The wheel carries the command
        run: |
          python - <<'PY'
          import glob
          import tomllib
          import zipfile

          # The name maturin gives the data directory carries the version, so
          # the expectation is read from the manifest rather than spelled here
          # - a release bump changes the wheel, not this assertion.
          with open("python/pyproject.toml", "rb") as manifest:
              version = tomllib.load(manifest)["project"]["version"]
          wheel, = glob.glob("python/dist/*.whl")
          scripts = [
              name
              for name in zipfile.ZipFile(wheel).namelist()
              if ".data/scripts/" in name
          ]
          assert scripts == [f"yggdryl-{version}.data/scripts/yggdryl"], scripts
          print(f"{wheel} carries {scripts[0]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  python:
    name: Python binding (${{ matrix.pyarrow }})
    needs: [changes, python-wheel]
    if: contains(needs.changes.outputs.jobs, ' python ')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both legs, or the `leaf` legs of `rows.toml` where only a leaf
        # crate's row runs this job.
        pyarrow: ${{ fromJSON(needs.changes.outputs.python_legs) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      # `pandas` and `polars` are not runtime dependencies; they are installed
      # so the tests covering the frame entry points run here instead of
      # skipping. `xxhash` is the outside C binding the digest parity suite
      # measures this implementation against: `python/tests/test_xxhash.py`
      # opens with `pytest.importorskip("xxhash")`, so without it every parity
      # test in that suite silently skipped, in both matrix legs. `requests`
      # is the reference client `yggdryl.http` is held to: the interop suite
      # in `python/tests/test_http.py` skips without it.
      - name: Install test tools
        run: >-
          python -m pip install "${{ matrix.pyarrow }}"
          "pytest>=8" "mypy>=1.15" "pandas>=2" "polars>=1" tzdata xxhash "requests>=2.32"
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/dist/*.whl
      # The script the release runs against every wheel it publishes that a
      # runner can load (docs/testing.md names the ones it cannot). It lived
      # in a `release.yml` heredoc that nothing executed until a release ran,
      # which is how a renamed module reached 0.1.9 and stopped it. Running it
      # here costs a second and moves that failure to the pull request.
      - name: Smoke test the wheel the way the release does
        run: python scripts/check_wheel_smoke.py
      - name: Smoke tests
        run: python -m pytest python/tests
      - name: Static typing
        run: >-
          python -m mypy --strict
          --config-file python/pyproject.toml
          python/yggdryl
          python/tests/typing_bindings.py
          python/tests/typing_fields.py

  # A free-threaded CPython loads neither the `abi3` wheel the `python` lane
  # tests nor any wheel built for a GIL interpreter, so free-threading is a
  # build of its own: `cp314-cp314t` from free-threaded 3.14 and
  # `cp315-abi3.abi3t`, PEP 803's free-threaded stable ABI, from 3.15 - one
  # maturin invocation, because both are outside the `abi3` family the
  # `python-wheel` job builds. The whole suite runs on 3.14t, where a
  # `#[pyclass]` shared across threads, a `detach` and the GIL staying off
  # are exercised for real. Free threading starts at 3.14: CPython declared
  # it supported there and PyO3 dropped 3.13t with it (#5865), so every PyO3
  # that builds abi3t refuses a free-threaded CPython below 3.14, and 3.12
  # has no free-threaded build at all. PyArrow publishes no wheel for 3.15 on
  # any
  # platform yet, and `import yggdryl` imports it, so on 3.15 and 3.15t the
  # smoke script loads the extension module alone and says what it skipped.
  python-freethreaded:
    name: Python binding (free-threaded 3.14t, abi3t 3.15)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' python-freethreaded ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # 3.15 is a release candidate, which setup-python installs only when
      # prereleases are allowed. The last listed comes first on PATH, so
      # `python3.15` is the GIL build rather than a name the free-threaded
      # one also installs; every interpreter below is asserted besides.
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.15t
            3.15
            3.14t
          allow-prereleases: true
      # Its own build: the free-threaded interpreters take PyO3 features no
      # other job compiles. It reads the wheel job's dependency cache.
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: python
      - name: Install Maturin
        run: python3.14t -m pip install "maturin>=1.15,<2"
      # Debug, as in `python-wheel`: CI never measures.
      - name: Stage the yggdryl command
        run: python3.14t scripts/stage_cli.py --debug --locked
      - name: Build the free-threaded wheels
        run: >-
          python3.14t -m maturin build --locked --profile dev
          --manifest-path python/Cargo.toml
          --interpreter python3.14t python3.15 --out python/dist-ft
      - name: The wheels are the two the lane owes
        run: |
          python3.14t - <<'PY'
          import glob
          import os
          import zipfile

          wheels = sorted(glob.glob("python/dist-ft/*.whl"))
          # `yggdryl-<version>-<python tag>-<abi tag>-<platform tag>.whl`
          built = sorted("-".join(os.path.basename(wheel).split("-")[2:4]) for wheel in wheels)
          assert built == ["cp314-cp314t", "cp315-abi3.abi3t"], wheels
          abi3t, = [wheel for wheel in wheels if "-cp315-abi3.abi3t-" in wheel]
          modules = [
              name
              for name in zipfile.ZipFile(abi3t).namelist()
              if name.startswith("yggdryl/_native") and name.endswith((".so", ".pyd"))
          ]
          assert modules == ["yggdryl/_native.abi3t.so"], modules
          print(f"{abi3t} holds {modules[0]}")
          PY
      # The `python` lane's tools but `polars`, which publishes no
      # free-threaded wheel, so its suites skip here and nowhere else.
      # `typing_extensions` is imported by the hints suite; `mypy` brings it
      # to the other lane.
      - name: Install test tools (3.14t)
        run: |
          python3.14t -m venv "$RUNNER_TEMP/ft"
          echo "$RUNNER_TEMP/ft/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ft/bin/python" -c "import sys; assert not sys._is_gil_enabled(), sys.version"
          "$RUNNER_TEMP/ft/bin/python" -m pip install --only-binary ":all:" \
            "pyarrow>=18" "pytest>=8" "pandas>=2" tzdata xxhash "requests>=2.32" "typing_extensions>=4.4"
      - name: Install wheel (3.14t)
        run: python -m pip install --no-deps python/dist-ft/*-cp314-cp314t-*.whl
      - name: Smoke test the wheel the way the release does (3.14t)
        run: python scripts/check_wheel_smoke.py
      - name: Tests (3.14t)
        run: python -m pytest python/tests
      # Each 3.15 installs the abi3t wheel by name and no PyArrow, which is
      # what proves pip takes the tag on either build and the extension loads
      # there, with the GIL left off on 3.15t.
      - name: Load the abi3t extension (3.15, 3.15t)
        run: |
          for version in 3.15 3.15t; do
            venv="$RUNNER_TEMP/smoke-$version"
            "python$version" -m venv "$venv"
            "$venv/bin/python" -c "import sys, sysconfig; free = 't' if sysconfig.get_config_var('Py_GIL_DISABLED') == 1 else ''; assert '%d.%d%s' % (*sys.version_info[:2], free) == '$version', sys.version"
            "$venv/bin/python" -m pip install --no-deps python/dist-ft/*-cp315-abi3.abi3t-*.whl
            "$venv/bin/python" scripts/check_wheel_smoke.py --extension-only
          done

  spark-interop:
    # The Iceberg exchange with Apache Spark, the format's reference
    # implementation. Spark is a JVM plus a few hundred megabytes of
    # packages, so the suite is gated behind its own marker: the default
    # pytest run above deselects it, this dedicated job provisions Spark with
    # scripts/setup_spark_interop.py and runs exactly it.
    name: Spark interop
    needs: [changes, python-wheel]
    if: contains(needs.changes.outputs.jobs, ' spark-interop ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      - name: Install test tools
        run: python -m pip install "pyarrow>=18" "pytest>=8"
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/dist/*.whl
      - name: Provision Spark and the Iceberg runtime
        run: python scripts/setup_spark_interop.py
      # Collection imports every test module it sees, deselected or not, so
      # the run is pointed at the one interop module rather than the whole
      # tree - the other modules' imports (pandas, typing_extensions) are the
      # default job's business, not this one's.
      - name: Exchange tables with Spark
        run: python -m pytest python/tests/test_spark_interop.py -m spark_interop

  cli:
    # The CLI's tests start the `yggdryl` binary and drive it - `yggdryl fix`
    # over a dictionary, `yggdryl xmla serve` over a socket. The binary links
    # the default-feature core plus `http`, a feature set no lane builds, so
    # it builds here, at once.
    name: CLI tests
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' cli ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: cli
          save: "true"
      - name: CLI tests and benchmark smoke tests
        run: cargo test --locked -p yggdryl-cli --all-targets --no-fail-fast

  node-addon:
    # napi builds the addon for `--target x86_64-unknown-linux-gnu`, a
    # directory no lane writes, so it builds here in place, at once, and the
    # addon goes on to the Node.js tests and the JavaScript examples.
    name: Node.js addon
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' node-addon ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: node
          save: "true"
      - name: Install Node.js build tooling
        run: npm ci --prefix node
      - name: Regenerate native module and audit package
        run: npm run --prefix node test:package:debug
      - name: Generated loader and declarations are current
        run: git diff --exit-code -- node/index.js node/index.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: node-addon
          path: node/*.node
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  node:
    # No Rust: the addon arrives built.
    name: Node.js binding
    needs: [changes, node-addon]
    if: contains(needs.changes.outputs.jobs, ' node ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: node-addon
          path: node
      - name: Install Node.js packages
        run: npm ci --prefix node
      - name: Smoke tests
        run: npm test --prefix node
      # The interactive documentation is generated by this addon, and the docs
      # workflow is Python-only, so the drift check belongs to the job that
      # tests it.
      - name: Check the generated documentation manifests
        run: |
          node scripts/build_docs_playground.js --check
          node scripts/build_docs_fix.js --check

  # Every fenced example under `docs/` and `skills/` compiled and run, in each
  # of the three languages it is shown in - which the documentation contract
  # requires of every example and nothing had ever enforced. `docs.yml`
  # re-runs whenever the script changes but has never executed it, and
  # `mkdocs build --strict` reads links and navigation, never a code block.
  # 772 examples were shipping unrun.
  #
  # One job per language, each behind what it runs on: the Rust half
  # generates an integration target and compiles it against `parquet iceberg
  # s3 s3tables http3`, the Python half runs under `python/.venv` with the
  # wheel, and the JavaScript half needs the built addon and the Arrow
  # package beside it.
  docs-rust:
    # The examples' feature set is every feature but `internals`, which adds
    # no dependency, so the full lane's cache holds every crate it links.
    name: Documentation examples (Rust)
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' docs-rust ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ needs.changes.outputs.toolchain }}
          cache: stable-full
      - name: Compile and run every Rust example
        run: python scripts/check_docs_examples.py --lang rust

  docs-python:
    name: Documentation examples (Python)
    needs: [changes, python-wheel]
    if: contains(needs.changes.outputs.jobs, ' docs-python ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      # The script runs a Python example under `python/.venv`, so the wheel and
      # what the examples import go there rather than into the job's Python.
      - name: Provision the interpreter the Python examples run under
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install "pyarrow>=18" "pytest>=8" "pandas>=2" "polars>=1" tzdata
          python/.venv/bin/pip install --force-reinstall --no-deps python/dist/*.whl
      - name: Run every Python example
        run: python scripts/check_docs_examples.py --lang python

  docs-javascript:
    name: Documentation examples (JavaScript)
    needs: [changes, node-addon]
    if: contains(needs.changes.outputs.jobs, ' docs-javascript ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: node-addon
          path: node
      - name: Install the packages the JavaScript examples require
        run: npm ci --prefix node
      - name: Run every JavaScript example
        run: python scripts/check_docs_examples.py --lang javascript

  inventory:
    # The inventories read against the crate's and both bindings' sources;
    # nothing is built.
    name: API inventories
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' inventory ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the API inventories against the crate and both bindings
        run: python scripts/check_api_inventory.py

  leaves:
    # Every leaf crate `rows.toml` lists under `rust/<name>` - none until S4 -
    # proven the way the core is: clippy and rustdoc at `-D warnings`, its
    # tests and benchmark smoke tests in both feature lanes, sharded where
    # `rows.toml` says, its rustdoc examples, the optimized benchmark
    # configuration, and a check at the declared MSRV where it names one.
    # A leaf compiles the core under its own feature unification, so it
    # builds in place, at once, over its own dependency cache, which its full
    # lane's `rest` shard saves on `main`. `FLAGS` is split on spaces: a leaf
    # names its features with commas.
    name: Leaf (${{ matrix.name }}, ${{ matrix.lane }}, ${{ matrix.shard }})
    needs: [changes]
    if: contains(needs.changes.outputs.jobs, ' leaves ')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.leaves) }}
    env:
      PACKAGE: ${{ matrix.package }}
      LANE: ${{ matrix.lane }}
      SHARD: ${{ matrix.shard }}
      FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/rust-lane
        with:
          mode: setup
          toolchain: ${{ matrix.toolchain || needs.changes.outputs.toolchain }}
          cache: ${{ matrix.cache }}
          save: ${{ matrix.save }}
          components: ${{ matrix.lane != 'msrv' && 'clippy' || '' }}
      - name: Check at the declared MSRV
        if: matrix.lane == 'msrv'
        run: |
          read -ra flags <<< "$FLAGS"
          cargo check --locked -p "$PACKAGE" --all-targets "${flags[@]}"
      - name: Clippy
        if: matrix.lane != 'msrv' && matrix.shard == 'rest'
        run: |
          read -ra flags <<< "$FLAGS"
          cargo clippy --locked -p "$PACKAGE" --all-targets --no-deps "${flags[@]}" -- -D warnings
      - name: Tests and benchmark smoke tests
        if: matrix.lane != 'msrv'
        run: |
          read -ra flags <<< "$FLAGS"
          python3 scripts/ci/plan.py targets "$PACKAGE" "$LANE" "$SHARD" > "$RUNNER_TEMP/targets"
          mapfile -t targets < "$RUNNER_TEMP/targets"
          cargo test --locked -p "$PACKAGE" --no-fail-fast "${flags[@]}" "${targets[@]}"
      - name: Rustdoc examples
        if: matrix.lane != 'msrv' && matrix.shard == 'rest'
        run: |
          read -ra flags <<< "$FLAGS"
          cargo test --locked -p "$PACKAGE" --doc "${flags[@]}"
      - name: Documentation
        if: matrix.lane != 'msrv' && matrix.shard == 'rest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -ra flags <<< "$FLAGS"
          cargo doc --locked -p "$PACKAGE" --no-deps "${flags[@]}"
      - name: Check optimized benchmark configuration
        if: matrix.lane != 'msrv' && matrix.shard == 'rest'
        run: |
          read -ra flags <<< "$FLAGS"
          cargo check --locked -p "$PACKAGE" --profile bench --benches "${flags[@]}"

  ci:
    # The one check to require. It fails unless `changes` planned the run,
    # every planned job passed and every other job was skipped - a planned
    # job a failure upstream skipped is a failure here, and so is a job an
    # `if:` let run unplanned - and it runs when anything above failed or
    # was cancelled, so a skipped gate never reads as a pass. On a pull
    # request it first adds to the ledger every row whose jobs all passed.
    name: CI result
    needs: [
      changes, fmt, lint-default, lint-full, iceberg-msrv,
      core-default, core-full, core-interop,
      core-tests-default, core-tests-full,
      pyiceberg-interop, object-interop, azure-interop, gcs-interop,
      zip-interop, avro-interop, excel-interop,
      python-wheel, python, python-freethreaded, spark-interop,
      cli, node-addon, node, docs-rust, docs-python, docs-javascript,
      inventory, leaves
    ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Restore the ledger
        if: github.event_name == 'pull_request' && needs.changes.result == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-ledger
          key: ci-ledger-${{ github.run_id }}
          restore-keys: ci-ledger-
      - name: Record the rows this run proved
        id: record
        if: github.event_name == 'pull_request' && needs.changes.result == 'success'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py record
      - name: Save the ledger
        if: steps.record.outputs.added != '' && steps.record.outputs.added != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-ledger
          key: ci-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Every planned job passed and every other was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py gate
