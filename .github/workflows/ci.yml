name: CI

on:
  # A feature-branch push with an open PR already emits `pull_request`'s
  # synchronize event. Restricting `push` to main keeps one CI run per change.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A pull request supersedes itself: pushing to the branch makes the run still
# testing the replaced commit worthless, so it is cancelled. A push to `main`
# supersedes nothing - every commit there is a tip somebody releases from, and
# it is the only run that will ever test it - so each is grouped by its own SHA
# and runs to completion. Both used to share `github.ref`, which put every
# `main` push in one group under `cancel-in-progress: true`: the next merge
# killed the previous merge's CI, and 24 of the last 100 `main` runs died that
# way, 17 to 54 seconds after the following push arrived. `docs.yml` already
# draws this distinction; this is CI catching up with it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # The default lane selects only the core, otherwise the bindings would
    # unify Parquet and Iceberg into it. The full lane also lints binding Rust.
    name: Rust quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            cache_key: default
            clippy_packages: -p yggdryl
            doc_packages: -p yggdryl
            flags: ""
          - name: all features
            cache_key: full
            clippy_packages: --workspace
            doc_packages: --workspace
            flags: --all-features
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        if: matrix.name == 'default features'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.clippy_packages }} --all-targets ${{ matrix.flags }} --no-deps -- -D warnings
      - name: Tests and benchmark smoke tests
        run: cargo test --locked -p yggdryl --all-targets ${{ matrix.flags }}
      # `--all-targets` is `--lib --bins --examples --tests --benches`, and
      # doctests are none of those: the step above has never compiled one.
      # They are the examples the published API pages carry, so they are the
      # examples most read and least run - 190 of them on default features.
      - name: Rustdoc examples
        run: cargo test --locked -p yggdryl --doc ${{ matrix.flags }}
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked ${{ matrix.doc_packages }} --no-deps ${{ matrix.flags }}
      - name: Check optimized benchmark configuration
        run: cargo check --locked -p yggdryl --profile bench --benches ${{ matrix.flags }}

  core-msrv:
    name: Core Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install core MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check core at its declared MSRV
        run: |
          cargo +1.85.0 check --locked --manifest-path rust/Cargo.toml -p yggdryl --all-targets
          cargo +1.85.0 check --locked --manifest-path rust/Cargo.toml -p yggdryl --no-default-features --lib
          cargo +1.85.0 check --locked --manifest-path rust/Cargo.toml -p yggdryl --no-default-features --features object --lib

  iceberg-msrv:
    name: Iceberg Rust 1.94
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Iceberg MSRV
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check the official Iceberg boundary at its declared MSRV
        run: cargo +1.94.0 check --locked --manifest-path rust/Cargo.toml -p yggdryl --all-targets --features iceberg

  pyiceberg-interop:
    name: PyIceberg exchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-full
          save-if: false
      - name: Install the external implementation
        run: python -m pip install "pyiceberg[pyarrow,sql-sqlite]==0.11.1" "pyarrow==25.0.1"
      - name: Exchange v1, v2, and v3 tables
        run: python scripts/check_iceberg_interop.py

  python-wheel:
    name: Python binding wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-full
          save-if: false
      - name: Install Maturin
        run: python -m pip install "maturin>=1.9,<2"
      # maturin copies python/wheel-data/ into the wheel and builds no binary
      # of its own, so the command is staged before the wheel is built.
      - name: Stage the ygg command
        run: python scripts/stage_cli.py
      - name: Build wheel
        run: maturin build --locked --manifest-path python/Cargo.toml --interpreter python --out python/dist
      # Nothing else fails when staging is skipped - the wheel just quietly
      # loses the command - so the contract is asserted rather than trusted.
      - name: The wheel carries the command
        run: |
          python - <<'EOF'
          import glob
          import tomllib
          import zipfile

          # The name maturin gives the data directory carries the version, so
          # the expectation is read from the manifest rather than spelled here
          # - a release bump changes the wheel, not this assertion.
          with open("python/pyproject.toml", "rb") as manifest:
              version = tomllib.load(manifest)["project"]["version"]
          wheel, = glob.glob("python/dist/*.whl")
          scripts = [
              name
              for name in zipfile.ZipFile(wheel).namelist()
              if name.endswith(".data/scripts/ygg")
          ]
          assert scripts == [f"yggdryl-{version}.data/scripts/ygg"], scripts
          print(f"{wheel} carries {scripts[0]}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  object-interop:
    # The S3 exchange with MinIO, cross-checked by boto3. A hand-written fake
    # store proves the client agrees with itself; this proves it agrees with a
    # real implementation, in both directions, on the keys a URL and a
    # signature spell differently. MinIO is downloaded by the script, so the
    # job provisions nothing of its own.
    name: S3 exchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # The driver builds the `interop` target with `--features object`, and every
      # other cargo-building job restores a cache; this one compiled the crate
      # and the whole signed-HTTPS stack from scratch on every run. The full
      # lane is the leg that has `object` compiled.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-full
          save-if: false
      - name: Install the reference client
        run: python -m pip install "boto3>=1.34"
      - name: Exchange objects with MinIO and boto3
        run: python scripts/check_object_interop.py

  zip-interop:
    # The ZIP exchange with Python's `zipfile`, from the standard library.
    #
    # `rust/tests/interop/zip.rs` is not feature-gated, so every Rust lane
    # already runs it - and its three reading tests report `ok` having
    # asserted nothing, because the archive `zipfile` writes is not there and
    # the halves print `SKIPPED` and return. Only this driver produces that
    # archive, and only it fails on the word. Until this job existed, the
    # reading side of the ZIP backend had never once executed under CI.
    name: ZIP exchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # The driver builds the `interop` target on default features, which is
      # what the default lane warms.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-default
          save-if: false
      - name: Exchange archives with zipfile
        run: python scripts/check_zip_interop.py

  avro-interop:
    # The Avro exchange with fastavro, and - when the probe builds - with the
    # `apache-avro` crate. Same shape as the ZIP job and the same reason:
    # `rust/tests/interop/avro.rs` is ungated, so its reading half has been
    # reporting `ok` in every lane while skipping for want of the container
    # fastavro writes. The driver writes it and refuses the skip.
    #
    # fastavro is a checking tool of the script, never a dependency of the
    # crate; the `apache-avro` probe is a scratch project the script writes
    # outside the workspace, and a build failure there is reported and
    # tolerated rather than failing the job.
    name: Avro exchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-default
          save-if: false
      - name: Install the reference implementation
        run: python -m pip install fastavro
      - name: Exchange containers with fastavro
        run: python scripts/check_avro_interop.py

  python:
    name: Python binding (${{ matrix.pyarrow }})
    needs: python-wheel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pyarrow:
          - "pyarrow==18.*"
          - "pyarrow>=18"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      # `pandas` and `polars` are not runtime dependencies; they are installed
      # so the tests covering the frame entry points run here instead of
      # skipping. `xxhash` is the outside C binding the digest parity suite
      # measures this implementation against: `python/tests/xxhash` opens with
      # `pytest.importorskip("xxhash")`, so without it every parity test in
      # that suite silently skipped, in both matrix legs.
      - name: Install test tools
        run: >-
          python -m pip install "${{ matrix.pyarrow }}"
          "pytest>=8" "mypy>=1.15" "pandas>=2" "polars>=1" tzdata xxhash
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/dist/*.whl
      - name: Smoke tests
        run: python -m pytest python/tests
      - name: Static typing
        run: >-
          python -m mypy --strict
          --config-file python/pyproject.toml
          python/yggdryl
          python/tests/typing_bindings.py
          python/tests/types/typing_fields.py

  spark-interop:
    # The Iceberg exchange with Apache Spark, the format's reference
    # implementation. Spark is a JVM plus a few hundred megabytes of
    # packages, so the suite is gated behind its own marker: the default
    # pytest run above deselects it, this dedicated job provisions Spark with
    # scripts/setup_spark_interop.py and runs exactly it.
    name: Spark interop
    needs: python-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      - name: Install test tools
        run: python -m pip install "pyarrow>=18" "pytest>=8"
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps python/dist/*.whl
      - name: Provision Spark and the Iceberg runtime
        run: python scripts/setup_spark_interop.py
      # Collection imports every test module it sees, deselected or not, so
      # the run is pointed at the one interop module rather than the whole
      # tree - the other modules' imports (pandas, typing_extensions) are the
      # default job's business, not this one's.
      - name: Exchange tables with Spark
        run: python -m pytest python/tests/media/test_spark_interop.py -m spark_interop

  docs-examples:
    # Every fenced example under `docs/` compiled and run, in each of the three
    # languages it is shown in - which the documentation contract requires of
    # every example and nothing has ever enforced. `docs.yml` re-runs whenever
    # this script changes but has never executed it, and `mkdocs build
    # --strict` reads links and navigation, never a code block. 772 examples
    # were shipping unrun.
    #
    # The three halves need three toolchains, which is why the job is one and
    # not three: the Rust half generates an integration target and compiles it
    # against `parquet iceberg object`, the Python half runs under `python/.venv`
    # where the script looks for its interpreter, and the JavaScript half
    # needs the built addon and the Arrow package beside it.
    name: Documentation examples
    needs: python-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-full
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: python-ci-wheel
          path: python/dist
      # The script runs a Python example under `python/.venv`, so the wheel and
      # what the examples import go there rather than into the job's Python.
      - name: Provision the interpreter the Python examples run under
        run: |
          python -m venv python/.venv
          python/.venv/bin/pip install "pyarrow>=18" "pytest>=8" "pandas>=2" "polars>=1" tzdata
          python/.venv/bin/pip install --force-reinstall --no-deps python/dist/*.whl
      - name: Build the addon and the packages the JavaScript examples require
        run: |
          npm ci --prefix node
          npm run --prefix node build:debug
      - name: Compile and run every Rust example
        run: python scripts/check_docs_examples.py --lang rust
      - name: Run every Python example
        run: python scripts/check_docs_examples.py --lang python
      - name: Run every JavaScript example
        run: python scripts/check_docs_examples.py --lang javascript

  node:
    name: Node.js binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stable-full
          save-if: false
      - name: Install Node.js build tooling
        run: npm ci --prefix node
      - name: Regenerate native module and audit package
        run: npm run --prefix node test:package:debug
      - name: Generated loader and declarations are current
        run: git diff --exit-code -- node/index.js node/index.d.ts
      - name: Smoke tests
        run: npm test --prefix node
      # The interactive documentation is generated by this addon, and the docs
      # workflow is Python-only, so the drift check belongs to the job that
      # already built it.
      - name: Check the generated documentation manifests
        run: |
          node scripts/build_docs_playground.js --check
          node scripts/build_docs_fix.js --check
