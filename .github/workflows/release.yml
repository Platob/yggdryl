name: Release

# One workflow releases all three package surfaces - the core crate to
# crates.io, the Python wheels and sdist to PyPI, and the Node.js package
# carrying every platform's native module to npm - and `main` drives it: a
# push whose version has no `v<version>` tag yet builds, publishes, and then
# creates the tag and the GitHub release as the record that the version is
# fully out. A push whose version is already tagged does nothing beyond the
# preflight, so ordinary commits cost one small job.
#
# Every publish is idempotent - a registry that already has the version is
# skipped, never failed - so a run that died halfway is repaired by re-running
# it (or by the next push to `main`): only the missing registries publish, and
# the tag still lands last. Pushing a `v*` tag by hand releases the same way,
# and running the workflow by hand builds and verifies everything without
# publishing, so a release can be rehearsed.
#
# Nothing here names the repository - only `github.*` context - so the
# workflow survives a repository migration. Credentials, configured once on
# the repository (and again after any migration):
#   - crates.io: the `CARGO_REGISTRY_TOKEN` secret.
#   - PyPI: trusted publishing (OIDC) for this repository and workflow,
#     bound to the `pypi` environment - no stored secret, and the binding
#     names the repository, so a migrated repository must be re-registered.
#   - npm: trusted publishing (OIDC) for this repository and workflow,
#     bound to the `npm` environment - no stored secret, and the binding
#     names the repository, so a migrated repository must be re-registered.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-publish: a half-published version is worse than
# a slow one. Queued runs of the same ref wait instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    # The workspace manifest, the Python project, and the npm package each
    # spell the version; a release where they disagree - or where a pushed
    # tag names none of them - stops here, before anything is built. The one
    # decision this job publishes: whether this run releases (`publish`), and
    # which version it is.
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: One version, three manifests, and whether it is already out
        id: decide
        run: |
          version=$(python3 - <<'EOF'
          import json
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              workspace = tomllib.load(manifest)["workspace"]["package"]["version"]
          with open("python/pyproject.toml", "rb") as manifest:
              python_version = tomllib.load(manifest)["project"]["version"]
          with open("node/package.json", encoding="utf-8") as manifest:
              node_version = json.load(manifest)["version"]

          versions = {
              "Cargo.toml [workspace.package]": workspace,
              "python/pyproject.toml [project]": python_version,
              "node/package.json": node_version,
          }
          if len(set(versions.values())) != 1:
              sys.exit(f"expected one version everywhere, got {versions}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if tag != f"v{workspace}":
                  sys.exit(f"expected the tag v{workspace}, got {tag}")
          print(workspace)
          EOF
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A hand-run rehearses: build and verify everything, publish
            # nothing.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "rehearsal for $version"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing $version from its tag"
          elif git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$version is already tagged; nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing $version from main"
          fi

  consistency:
    # The tag is the only record that a version is out, so a version with no
    # tag can still be half out - and republishing a half-published version
    # from a tree that has moved is how one number comes to name two
    # different libraries. crates.io and npm cannot be rewritten, PyPI
    # cannot be rewritten, and the registries that already answered are the
    # ones that decide what the version means.
    #
    # So: all three or none, when `main` is the ref. A version some
    # registries already carry is finished from the commit they were built
    # at, by pushing `v<version>` there - which pins the tree the wheels are
    # built from - or it is abandoned and `main` bumps. Neither is a push to
    # `main`, and this is where that is refused rather than discovered.
    #
    # A rehearsal runs it too, because every build job needs it and a job
    # whose need was skipped is skipped with it: a hand-run that skipped this
    # built nothing at all. A rehearsal publishes nothing, so there a half-out
    # version is reported and not refused.
    name: No version is half out
    needs: preflight
    if: needs.preflight.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: All three registries, or none
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          crate=no
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$VERSION\""; then crate=yes; fi
          pypi=no
          if curl -fsSL "https://pypi.org/pypi/yggdryl/$VERSION/json" >/dev/null 2>&1; then pypi=yes; fi
          npm=no
          if curl -fsSL "https://registry.npmjs.org/yggdryl/$VERSION" >/dev/null 2>&1; then npm=yes; fi
          echo "crates.io=$crate pypi=$pypi npm=$npm for $VERSION"
          held="$crate$pypi$npm"
          if [ "$held" = "nonono" ] || [ "$held" = "yesyesyes" ]; then
            echo "$VERSION is consistently out or consistently unreleased"
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            echo "::warning title=Finishing a half-published version::$VERSION is on some registries and not others; the tag pins the tree, so this run finishes it"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::warning title=$VERSION is half published::crates.io=$crate pypi=$pypi npm=$npm; a rehearsal publishes nothing"
            exit 0
          fi
          echo "::error title=$VERSION is half published::crates.io=$crate pypi=$pypi npm=$npm"
          cat >&2 <<EOF
          $VERSION is already on some registries and not others, and this run is a
          push to a branch, so the tree it would publish is whatever that branch
          holds now - which is not necessarily the tree the published artifacts
          were built from. Publishing from here would give one version number two
          different contents.

          Finish it from the commit it was built at:   git tag v$VERSION <commit> && git push origin v$VERSION
          Or leave it partial and move on:             bump every manifest and push that.
          EOF
          exit 1

  crate:
    # crates.io carries only the core: the binding crates are `publish =
    # false` because their artifacts are the wheel and the npm package. The
    # dry run always happens, so a rehearsal exercises the same packaging and
    # verification a release performs; the sparse index says whether the
    # version is already up, so a repaired run skips instead of failing.
    name: crates.io (yggdryl)
    needs: [preflight, consistency]
    if: needs.preflight.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Package and verify
        run: cargo publish --locked -p yggdryl --dry-run
      - name: Publish
        if: needs.preflight.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${{ needs.preflight.outputs.version }}"
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$version\""; then
            echo "crates.io already has yggdryl $version; skipping"
          else
            cargo publish --locked -p yggdryl
          fi

  wheels:
    # One job per platform and libc, each building a wheel per CPython the
    # project supports (3.10 through 3.14; Windows on ARM starts at 3.11,
    # the first CPython published for it). The interpreters are named bare so
    # maturin resolves them from the manylinux and musllinux images on Linux
    # and from the setup-python tool cache elsewhere; where a smoke test
    # runs, 3.12 is listed last so it is the default `python` it runs under.
    # `smoke: false` marks the targets whose wheels cannot install on their
    # own build host - musl wheels on a glibc runner - or where PyArrow, the
    # hard runtime dependency, publishes no wheel to install against; the
    # build is still shipped so the platform works the day its stack does.
    name: Wheel (${{ matrix.label }})
    needs: [preflight, consistency]
    if: needs.preflight.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: manylinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.10
              3.11
              3.13
              3.14
              3.12
            smoke: true
          - label: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.10
              3.11
              3.13
              3.14
              3.12
            smoke: true
          - label: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.12
            smoke: false
          - label: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.12
            smoke: false
          - label: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: auto
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.10
              3.11
              3.13
              3.14
              3.12
            smoke: true
          - label: macos-aarch64
            runner: macos-14
            target: aarch64
            manylinux: auto
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.10
              3.11
              3.13
              3.14
              3.12
            smoke: true
          - label: windows-x64
            runner: windows-latest
            target: x64
            manylinux: auto
            interpreters: 3.10 3.11 3.12 3.13 3.14
            pythons: |
              3.10
              3.11
              3.13
              3.14
              3.12
            smoke: true
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64
            manylinux: auto
            interpreters: 3.11 3.12 3.13 3.14
            pythons: |
              3.11
              3.13
              3.14
              3.12
            smoke: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pythons }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      # maturin copies python/wheel-data/ into the wheel and builds no binary
      # of its own, so `ygg` is staged first - and staged where the wheel is
      # built. Off Linux that is the runner; on Linux it is inside the
      # manylinux or musllinux container, because a binary linked against the
      # runner's own glibc would defeat the tag the wheel carries.
      - name: Stage the ygg command
        if: runner.os != 'Linux'
        run: python scripts/stage_cli.py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          # An exact version is downloaded as it is named. A range - what the
          # action reads from pyproject.toml when none is given - is resolved
          # through the GitHub API first, and that lookup is what left the
          # macOS x86_64 row of the 0.1.12 release without a wheel
          # (`getaddrinfo ENOTFOUND api.github.com`). It stays inside the
          # `requires` range pyproject.toml declares.
          maturin-version: v1.15.0
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: python3 scripts/stage_cli.py
          args: >-
            --release --locked --manifest-path python/Cargo.toml --out dist
            --interpreter ${{ matrix.interpreters }}
      # A wheel that quietly lost the command is worse than a failed build, so
      # every row asserts what it shipped rather than trusting the step above.
      - name: The wheels carry the command
        shell: bash
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          assert wheels, "no wheel was built"
          for wheel in wheels:
              scripts = [
                  name
                  for name in zipfile.ZipFile(wheel).namelist()
                  if ".data/scripts/ygg" in name
              ]
              assert len(scripts) == 1, f"{wheel} carries {scripts}"
              print(f"{wheel} carries {scripts[0]}")
          EOF
      - name: Smoke test the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install "pyarrow>=18" --only-binary ":all:"
          python -m pip install --no-index --find-links dist yggdryl
          python scripts/check_wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0

  sdist:
    # The source distribution carries the whole workspace - maturin includes
    # the core as a path dependency and prunes the Node member - so an
    # architecture without a wheel can still build from source.
    name: Source distribution
    needs: [preflight, consistency]
    if: needs.preflight.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-pypi:
    name: PyPI (yggdryl)
    needs: [preflight, wheels, sdist]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI accepts this workflow's OIDC token instead
      # of a stored password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A repaired run re-uploads only what is missing.
          skip-existing: true

  node:
    # Each platform builds and tests its own native module; the npm package
    # ships every one of them, and the generated loader picks the matching
    # binary at require time.
    name: Node binary (${{ matrix.label }})
    needs: [preflight, consistency]
    if: needs.preflight.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner: ubuntu-latest
          - label: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - label: darwin-x64
            runner: macos-15-intel
          - label: darwin-arm64
            runner: macos-14
          - label: win32-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Node.js build tooling
        run: npm ci --prefix node
      - name: Build the release native module
        run: npm run build --prefix node
      - name: Smoke tests against the release binary
        run: npm test --prefix node
      # A crash names its file and never its test: the runner reads each file
      # in a child whose report dies with it, and a reporter writes on a later
      # turn of the event loop than the test it reports. Each failing file is
      # read again with `scripts/trace-tests.js` preloaded, which names every
      # test synchronously as it starts, and where lldb is at hand, under it,
      # for every thread's native stack at the fault.
      - name: Name the test a failing file stopped in
        if: failure()
        shell: bash
        working-directory: node
        run: |
          for file in tests/*.test.js tests/*/*.test.js; do
            [ -f "$file" ] || continue
            status=0
            node --require ./scripts/trace-tests.js --test-reporter=spec "$file" > "$file.log" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::$file (exit $status)"
              tail -n 80 "$file.log"
              if [ "$status" -gt 128 ] && command -v lldb > /dev/null; then
                lldb --batch -o run -k "thread backtrace all -c 60" -k "quit 1" -- \
                  "$(command -v node)" --require ./scripts/trace-tests.js "$file" 2>&1 | tail -n 400 || true
              fi
              echo "::endgroup::"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.label }}
          path: node/*.node
          if-no-files-found: error

  publish-npm:
    name: npm (yggdryl)
    needs: [preflight, node]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Trusted publishing: npm accepts this workflow's OIDC token instead of
      # a stored secret, exactly as PyPI does above. The binding names this
      # repository, workflow, and the `npm` environment on npmjs.com, so a
      # migrated repository must be re-registered there.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # No registry-url: npm's OIDC exchange keys off the Actions
          # id-token request variables alone, and that input only writes an
          # `_authToken` placeholder into .npmrc that muddies the failure
          # modes.
          package-manager-cache: false
      - name: Install an npm that speaks trusted publishing
        # OIDC exchange arrived in npm 11.5; node 22 bundles an older one.
        run: npm install -g npm@latest
      - name: Install Node.js packaging tooling
        run: npm ci --prefix node
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node
          merge-multiple: true
      - name: Every platform binary is present
        run: |
          count=$(ls node/*.node | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 platform binaries, got $count:"
            ls node/*.node
            exit 1
          fi
      - name: Audit the npm package contents
        run: npm run --prefix node test:package:files
      - name: The OIDC grant engaged
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token request variables are absent; npm cannot exchange"
            exit 1
          fi
          echo "id-token request variables are present"
      - name: Publish
        working-directory: node
        run: |
          version="${{ needs.preflight.outputs.version }}"
          if npm view "yggdryl@$version" version >/dev/null 2>&1; then
            echo "npm already has yggdryl $version; skipping"
          else
            # Verbose: npm reports OIDC exchange failures only at this level.
            npm publish --access public --loglevel verbose
          fi

  release:
    # The tag and the GitHub release land last, after every registry has the
    # version: their existence is the statement that the release is complete,
    # and their absence is what makes the next run on `main` finish a
    # half-published one.
    name: Tag and GitHub release
    needs: [preflight, crate, publish-pypi, publish-npm]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create the tag and the release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ needs.preflight.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released"
          else
            gh release create "$version" --target "$GITHUB_SHA" \
              --title "$version" --generate-notes
          fi

  report:
    # A release that dies is silent where it matters. Its own red tick is on
    # a push nobody opened, `main` goes on spelling a version no registry
    # finished, and the tag - the one record that a version is out - is
    # exactly what a failed run never writes. That is how 0.1.9 reached
    # crates.io and npm, missed PyPI, and then took four commits of feature
    # work under the same number before anyone read the run.
    #
    # So a release that was going to publish and did not says so where it
    # will be read: one issue per version, naming what each registry
    # actually holds. A second failure of the same version comments on that
    # issue rather than opening another, and the issue is the thing to close
    # once the repair run is green.
    #
    # It fires on a failed `preflight` too. A preflight that refuses is the
    # loudest failure there is - three manifests disagreeing, or a tag naming
    # a version nothing spells - and it is the one case where no version
    # output exists to name, so the commit names the report instead.
    name: Say so when a release did not finish
    needs: [preflight, consistency, crate, wheels, sdist, publish-pypi, node, publish-npm, release]
    if: >-
      always() && github.event_name != 'workflow_dispatch'
      && (needs.preflight.result == 'failure'
          || (needs.preflight.outputs.publish == 'true'
              && (contains(needs.*.result, 'failure')
                  || contains(needs.*.result, 'cancelled'))))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: The version, and what each registry holds
        id: state
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # A curl that fails reads as "this registry does not have it",
          # which is the safe reading: the report says so and a human looks.
          if [ -z "${VERSION:-}" ]; then
            # Preflight never published one, so the tree is the only source -
            # and it is the tree whose disagreement is being reported.
            VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])' 2>/dev/null || echo "")
          fi
          if [ -z "$VERSION" ]; then
            echo "title=Release from ${GITHUB_SHA} did not finish" >> "$GITHUB_OUTPUT"
            echo "state=The workspace version could not be read, so this run never chose one." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "title=Release $VERSION did not finish" >> "$GITHUB_OUTPUT"
          held() {
            if [ "$2" = "yes" ]; then echo "- $1: has \`$VERSION\`"; else echo "- $1: does **not** have \`$VERSION\`"; fi
          }
          crate=no
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$VERSION\""; then crate=yes; fi
          pypi=no
          if curl -fsSL "https://pypi.org/pypi/yggdryl/$VERSION/json" >/dev/null 2>&1; then pypi=yes; fi
          npm=no
          if curl -fsSL "https://registry.npmjs.org/yggdryl/$VERSION" >/dev/null 2>&1; then npm=yes; fi
          {
            echo "state<<YGGEOF"
            held "crates.io" "$crate"
            held "PyPI" "$pypi"
            held "npm" "$npm"
            echo "YGGEOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$crate$pypi$npm" != "nonono" ] && [ "$crate$pypi$npm" != "yesyesyes" ]; then
            echo "::error title=Half published::$VERSION is on some registries and not others"
          fi
      - name: File the report, or add to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ steps.state.outputs.title }}
          STATE: ${{ steps.state.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "The release from \`$GITHUB_SHA\` did not finish: $RUN_URL" \
            "$STATE" \
            "No tag is written until every registry has the version, so the next push to \`main\` spelling this version will try again. Fix the cause on \`main\` first: every publish skips a registry that already has the version, and the tag lands last." \
            "A version some registries carry and others do not must not be republished from a tree that has moved. Finish it from the commit it was built at by pushing \`v<version>\` there, or leave it partial and bump."
          )
          # The title is the key: a hidden marker is not reliably indexed by
          # issue search, and two failures minutes apart would both miss it.
          open=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
