name: Release

# One workflow releases all three package surfaces - the core crate to
# crates.io, the Python wheels and sdist to PyPI, and the Node.js package
# carrying every platform's native module to npm - and `main` drives it: a
# push whose version has no `v<version>` tag yet builds, publishes, and then
# creates the tag and the GitHub release as the record that the version is
# fully out. A push whose version is already tagged does nothing beyond the
# preflight, so ordinary commits cost one small job.
#
# One job per platform builds everything that platform ships: the `yggdryl`
# command, the wheels - a stable-ABI wheel for every GIL CPython from 3.11
# on, one for 3.10, one for free-threaded 3.14 and a free-threaded stable-ABI
# one for every CPython from 3.15 on - and, on the five platforms the npm
# package carries, the Node.js module. The extension and the Node.js module
# link the same core with the same features, so a platform compiles it once,
# and the registries hear from this run only after every platform has built
# and smoke-tested what it ships. A release is thirteen jobs; it was twenty
# while each binding built its platforms in jobs of its own.
#
# Every publish is idempotent - a registry that already has the version is
# skipped, never failed - so a run that died halfway is repaired by re-running
# it (or by the next push to `main`): only the missing registries publish, and
# the tag still lands last. Pushing a `v*` tag by hand releases the same way,
# and running the workflow by hand builds and verifies everything without
# publishing, so a release can be rehearsed.
#
# Nothing here names the repository - only `github.*` context - so the
# workflow survives a repository migration. Credentials, configured once on
# the repository (and again after any migration):
#   - crates.io: the `CARGO_REGISTRY_TOKEN` secret.
#   - PyPI: trusted publishing (OIDC) for this repository and workflow,
#     bound to the `pypi` environment - no stored secret, and the binding
#     names the repository, so a migrated repository must be re-registered.
#   - npm: trusted publishing (OIDC) for this repository and workflow,
#     bound to the `npm` environment - no stored secret, and the binding
#     names the repository, so a migrated repository must be re-registered.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-publish: a half-published version is worse than
# a slow one. Queued runs of the same ref wait instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    # The workspace manifest, the Python project, and the npm package each
    # spell the version; a release where they disagree - or where a pushed
    # tag names none of them - stops here, before anything is built. The
    # decisions this job publishes: which version it is, whether this run
    # builds (`build`: a release or a rehearsal), and whether it publishes
    # what it builds (`publish`).
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: One version, three manifests, and whether it is already out
        id: decide
        run: |
          version=$(python3 - <<'EOF'
          import json
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              workspace = tomllib.load(manifest)["workspace"]["package"]["version"]
          with open("python/pyproject.toml", "rb") as manifest:
              python_version = tomllib.load(manifest)["project"]["version"]
          with open("node/package.json", encoding="utf-8") as manifest:
              node_version = json.load(manifest)["version"]

          versions = {
              "Cargo.toml [workspace.package]": workspace,
              "python/pyproject.toml [project]": python_version,
              "node/package.json": node_version,
          }
          if len(set(versions.values())) != 1:
              sys.exit(f"expected one version everywhere, got {versions}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if tag != f"v{workspace}":
                  sys.exit(f"expected the tag v{workspace}, got {tag}")
          print(workspace)
          EOF
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A hand-run rehearses: build and verify everything, publish
            # nothing.
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "rehearsal for $version"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing $version from its tag"
          elif git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$version is already tagged; nothing to release"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "releasing $version from main"
          fi

      # The tag is the only record that a version is out, so a version with
      # no tag can still be half out - and republishing a half-published
      # version from a tree that has moved is how one number comes to name
      # two different libraries. crates.io and npm cannot be rewritten, PyPI
      # cannot be rewritten, and the registries that already answered are the
      # ones that decide what the version means.
      #
      # So: all three or none, when `main` is the ref. A version some
      # registries already carry is finished from the commit they were built
      # at, by pushing `v<version>` there - which pins the tree the wheels are
      # built from - or it is abandoned and `main` bumps. Neither is a push to
      # `main`, and this is where that is refused rather than discovered: a
      # refusal fails this job, so nothing builds. A rehearsal publishes
      # nothing, so there a half-out version is reported and not refused.
      - name: No version is half out
        if: steps.decide.outputs.build == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          crate=no
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$VERSION\""; then crate=yes; fi
          pypi=no
          if curl -fsSL "https://pypi.org/pypi/yggdryl/$VERSION/json" >/dev/null 2>&1; then pypi=yes; fi
          npm=no
          if curl -fsSL "https://registry.npmjs.org/yggdryl/$VERSION" >/dev/null 2>&1; then npm=yes; fi
          echo "crates.io=$crate pypi=$pypi npm=$npm for $VERSION"
          held="$crate$pypi$npm"
          if [ "$held" = "nonono" ] || [ "$held" = "yesyesyes" ]; then
            echo "$VERSION is consistently out or consistently unreleased"
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            echo "::warning title=Finishing a half-published version::$VERSION is on some registries and not others; the tag pins the tree, so this run finishes it"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::warning title=$VERSION is half published::crates.io=$crate pypi=$pypi npm=$npm; a rehearsal publishes nothing"
            exit 0
          fi
          echo "::error title=$VERSION is half published::crates.io=$crate pypi=$pypi npm=$npm"
          cat >&2 <<EOF
          $VERSION is already on some registries and not others, and this run is a
          push to a branch, so the tree it would publish is whatever that branch
          holds now - which is not necessarily the tree the published artifacts
          were built from. Publishing from here would give one version number two
          different contents.

          Finish it from the commit it was built at:   git tag v$VERSION <commit> && git push origin v$VERSION
          Or leave it partial and move on:             bump every manifest and push that.
          EOF
          exit 1

  sources:
    # The two source packages. The crate crates.io carries - only the core:
    # the binding crates are `publish = false` because their artifacts are the
    # wheel and the npm package - is packaged and built from the package alone
    # here, and published by `release` once every platform has smoke-tested
    # its binaries. The source distribution carries the whole workspace -
    # maturin includes the core as a path dependency and prunes the Node
    # member - so an architecture without a wheel can still build from source.
    name: Source packages
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Package and verify the crate
        run: cargo publish --locked -p yggdryl --dry-run
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  build:
    # One job per platform and libc, each building four wheels and, where
    # `node` names the npm package's platform, the Node.js module:
    #
    #   - `cp310-cp310`: 3.10 predates the buffer protocol's place in the
    #     limited API, so it gets a version-specific wheel. Windows on ARM
    #     starts at 3.11, the first CPython published for it, and has none.
    #   - `cp311-abi3`: the stable ABI from 3.11 (python/Cargo.toml), one
    #     wheel every GIL CPython from 3.11 on loads.
    #   - `cp314-cp314t`: a free-threaded CPython loads no `abi3` wheel, and
    #     3.14 has no stable ABI of its own for one, so free-threaded 3.14
    #     gets a version-specific wheel. Free threading starts there: CPython
    #     declared it supported from 3.14 and PyO3 dropped 3.13t with it
    #     (#5865), so every PyO3 that builds abi3t refuses a free-threaded
    #     CPython below 3.14, and 3.12 has no free-threaded build at all
    #     (PEP 703's first is 3.13); a GIL 3.12 or 3.13 loads `cp311-abi3`.
    #   - `cp315-abi3.abi3t`: PEP 803's free-threaded stable ABI, one wheel
    #     every CPython from 3.15 on loads, GIL or free-threaded.
    #
    # One maturin invocation builds one stable-ABI family, so the last two
    # are a second build over `interpreters-ft` beside the first over
    # `interpreters`. The interpreters are named bare so maturin resolves
    # them from the manylinux and musllinux images on Linux and from the
    # setup-python tool cache elsewhere. `pythons` is every CPython the
    # wheels claim that PyArrow, the hard runtime dependency, publishes a
    # wheel for, and the smoke test installs them into each one; 3.12 is
    # listed last so it is the default `python` the job's own scripts run
    # under. `pythons-extension` is the rest: CPython 3.15, for which PyArrow
    # publishes no wheel on any platform yet, loads the extension module
    # alone (scripts/check_wheel_smoke.py). `smoke: false` marks the target
    # where PyArrow publishes no wheel at all, which loads the extension
    # alone too; the build is still shipped so the platform works the day
    # its stack does.
    #
    # A `musl` row smokes its wheels in musl CPythons from uv, run on the
    # glibc runner by the musl loader the row installs. Those rows once
    # smoked nothing, and 0.1.13 to 0.1.18 - every release since mimalloc
    # became the allocator - shipped musllinux wheels no musl interpreter
    # could import: mimalloc's thread-locals were initial-exec, which musl's
    # loader refuses in a module it opens with `dlopen` (python/Cargo.toml).
    # Their `pythons` leave out 3.10: uv's musl CPython 3.10 loads extension
    # modules named `-linux-musl`, and a cp310 musllinux wheel - PyArrow's
    # as much as this one - carries the `-linux-gnu` name the musllinux
    # image's CPython 3.10 gives it, so neither imports there. The 3.10
    # wheel is held to the fix by reading its extension instead.
    #
    # Both macOS targets build on Apple silicon. x86_64 is a cross build
    # there that pyo3 and maturin treat as native: a Mac CPython describes
    # the same extension for either architecture, so the arm64 CPythons build
    # the x86_64 wheels. The smoke tests run what ships under Rosetta 2 - the
    # wheels in self-contained x86_64 CPythons from uv, because the x64 ones
    # setup-python installs link Intel Homebrew's gettext and do not start
    # there, and the Node.js module under the x64 Node.js. The Intel runner
    # that built it before took 15 minutes per CPython's link where Apple
    # silicon took 6 (the 0.1.14 rehearsal), and 29 minutes for the Node.js
    # module where Apple silicon took 16 (the 0.1.15 release).
    #
    # The wheels and the Node.js module link one core, compiled once: the
    # second binding to build finds the core's artifacts fresh in the target
    # directory the first left them in - the extension on Linux, where the
    # container builds the Node.js module first, the Node.js module
    # elsewhere. That holds only while every build in the job sees the same
    # features (the workspace manifest keeps them equal), the same
    # `--target`, and the same environment - which is why the rehearsal's
    # debug settings, the macOS deployment target and maturin's macOS link
    # flags are set for the whole job rather than for one build.
    name: Build (${{ matrix.label }})
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      # A rehearsal publishes nothing, so it keeps the symbols and line
      # tables the shipped binaries strip: a crash its smoke tests find is
      # then named by function and line in the stack the failure step
      # prints, rather than by an offset into a stripped binary. Neither
      # setting changes the code the compiler emits.
      CARGO_PROFILE_RELEASE_STRIP: ${{ github.event_name == 'workflow_dispatch' && 'none' || 'symbols' }}
      CARGO_PROFILE_RELEASE_DEBUG: ${{ github.event_name == 'workflow_dispatch' && 'line-tables-only' || 'false' }}
      # sccache's server exits after ten idle minutes, and a compile in
      # flight did not keep it: on the 0.1.14 rehearsal's Intel row the
      # core's compile lost the server ten minutes in and started over
      # without it. Zero keeps the server for the job's lifetime.
      SCCACHE_IDLE_TIMEOUT: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: manylinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            triple: x86_64-unknown-linux-gnu
            manylinux: auto
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.10
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            node: linux-x64-gnu
          - label: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            triple: aarch64-unknown-linux-gnu
            manylinux: auto
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.10
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            node: linux-arm64-gnu
          - label: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64
            triple: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            musl: true
          - label: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            triple: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            musl: true
          - label: macos-x86_64
            runner: macos-14
            target: x86_64
            triple: x86_64-apple-darwin
            node-arch: x64
            rosetta: true
            macos: "10.12"
            manylinux: auto
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.10
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            node: darwin-x64
          - label: macos-aarch64
            runner: macos-14
            target: aarch64
            triple: aarch64-apple-darwin
            macos: "11.0"
            manylinux: auto
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.10
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            node: darwin-arm64
          - label: windows-x64
            runner: windows-latest
            target: x64
            triple: x86_64-pc-windows-msvc
            manylinux: auto
            interpreters: 3.10 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.10
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: true
            node: win32-x64
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64
            triple: aarch64-pc-windows-msvc
            manylinux: auto
            interpreters: 3.11
            interpreters-ft: 3.14t 3.15
            pythons: |
              3.11
              3.13
              3.14t
              3.14
              3.12
            pythons-extension: |
              3.15t
              3.15
            smoke: false
    steps:
      - uses: actions/checkout@v6
      # 3.15 is a release candidate, which setup-python installs only when
      # prereleases are allowed. A later entry comes first on PATH, so
      # `pythons-extension` lists 3.15 after 3.15t and `pythons` 3.14 after
      # 3.14t, and `python3.15` and `python3.14` are the GIL builds rather
      # than names the free-threaded ones also install - what uv resolves a
      # bare `3.14` to, since a request with no `t` takes either build and
      # takes the first on PATH (the 0.1.20 rehearsal, where every smoke of
      # 3.14 opened the free-threaded interpreter and refused it).
      - uses: actions/setup-python@v6
        with:
          python-version: |
            ${{ matrix.pythons-extension }}
            ${{ matrix.pythons }}
          allow-prereleases: true
      - uses: actions/setup-node@v6
        if: matrix.node
        with:
          node-version: "22"
          architecture: ${{ matrix.node-arch }}
          package-manager-cache: false
      # Linux builds everything inside the manylinux or musllinux container,
      # which installs its own toolchain; the runner compiles nothing.
      - name: Install Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.triple }}
      - name: Install Node.js build tooling
        if: matrix.node
        run: npm ci --prefix node
      # maturin sets the deployment target for its own build when none is
      # set, and the C the core's dependencies compile reads it, so a build
      # without it would compile those crates - and the core above them -
      # again. Set for the whole job, every build agrees; the values are
      # maturin's own defaults, so the wheel tags do not move.
      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos }}" >> "$GITHUB_ENV"
      # maturin copies python/wheel-data/ into the wheel and builds no binary
      # of its own, so `yggdryl` is staged first - and staged where the wheel is
      # built. Off Linux that is the runner; on Linux it is inside the
      # manylinux or musllinux container, because a binary linked against the
      # runner's own glibc would defeat the tag the wheel carries. `--target`
      # puts it in the directory the wheels build in, so the crates the two
      # resolve alike are compiled once. Its core is its own: the terminal
      # crates it links change features under the core's dependencies.
      - name: Stage the yggdryl command
        if: runner.os != 'Linux'
        run: python scripts/stage_cli.py --target ${{ matrix.triple }}
      # maturin links a macOS extension with `-undefined dynamic_lookup` and
      # hands the flags to every crate in the build, and a crate compiled
      # under other flags is not reused. Stated here for the rest of the job,
      # maturin finds them set and adds nothing, and the Node.js module - whose
      # own build script asks the linker for the same thing - compiles against
      # the core the extension left behind. The command above links without.
      - name: Link the bindings the way maturin links the extension
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=-C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          # An exact version is downloaded as it is named. A range - what the
          # action reads from pyproject.toml when none is given - is resolved
          # through the GitHub API first, and that lookup is what left the
          # macOS x86_64 row of the 0.1.12 release without a wheel
          # (`getaddrinfo ENOTFOUND api.github.com`). It stays inside the
          # `requires` range pyproject.toml declares.
          maturin-version: v1.15.0
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # On Linux the Node.js module is built here too, in the container
          # the wheels build in: it shares their core, and it links against
          # the container's glibc 2.17 rather than the runner's. Built on the
          # runner, 0.1.15's module asked for GLIBC_2.39 (`readelf -V`), so it
          # could not load on Ubuntu 22.04 or Debian 12. The runner's
          # `RUSTC_WRAPPER` names an sccache the container does not have yet.
          before-script-linux: >-
            python3 scripts/stage_cli.py --target ${{ matrix.triple }}
            ${{ matrix.node && format('&& env -u RUSTC_WRAPPER cargo build --release --locked -p yggdryl-node --target {0}', matrix.triple) || '' }}
          args: >-
            --release --locked --manifest-path python/Cargo.toml --out dist
            --interpreter ${{ matrix.interpreters }}
      # The free-threaded stable ABI is another family than `abi3`, and one
      # maturin invocation builds one, so the free-threaded wheels are a build
      # of their own. It compiles the binding again and finds the core fresh
      # where the build above left it; on Linux it runs in the same image,
      # which reads the command the step above staged in the workspace.
      - name: Build the free-threaded and abi3t wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          sccache: true
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --manifest-path python/Cargo.toml --out dist
            --interpreter ${{ matrix.interpreters-ft }}
      # A wheel that quietly lost the command is worse than a failed build, and
      # a wheel per CPython is what the stable ABI retired, so every row
      # asserts what it shipped rather than trusting the steps above: the
      # `cp311-abi3` and `cp315-abi3.abi3t` wheels, `cp314-cp314t` where the
      # row builds free-threaded 3.14, a version-specific one per interpreter
      # older than 3.11, in each the command, and in the abi3t wheel the
      # extension under the name every 3.15 and later loads it by.
      - name: The wheels are the ones the row owes, and carry the command
        shell: bash
        env:
          INTERPRETERS: ${{ matrix.interpreters }}
          INTERPRETERS_FT: ${{ matrix.interpreters-ft }}
        run: |
          python - <<'EOF'
          import glob
          import os
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          assert wheels, "no wheel was built"
          older = [
              version
              for version in os.environ["INTERPRETERS"].split()
              if tuple(map(int, version.split("."))) < (3, 11)
          ]
          expected = {"cp311-abi3", "cp315-abi3.abi3t"} | {
              f"cp{version.replace('.', '')}-cp{version.replace('.', '')}" for version in older
          }
          if "3.14t" in os.environ["INTERPRETERS_FT"].split():
              expected.add("cp314-cp314t")
          # `yggdryl-<version>-<python tag>-<abi tag>-<platform tag>.whl`
          built = [os.path.basename(wheel).split("-")[2:4] for wheel in wheels]
          assert sorted("-".join(tags) for tags in built) == sorted(expected), (
              f"expected {sorted(expected)}, built {wheels}"
          )
          for wheel in wheels:
              scripts = [
                  name
                  for name in zipfile.ZipFile(wheel).namelist()
                  if ".data/scripts/" in name
              ]
              # Exactly one script, under the command's exact name (`.exe` on
              # Windows) - never one whose name only starts the same way.
              assert len(scripts) == 1 and scripts[0].endswith(
                  (".data/scripts/yggdryl", ".data/scripts/yggdryl.exe")
              ), f"{wheel} carries {scripts}"
              print(f"{wheel} carries {scripts[0]}")
          abi3t, = [wheel for wheel in wheels if "-cp315-abi3.abi3t-" in wheel]
          extension = "yggdryl/_native.pyd" if os.name == "nt" else "yggdryl/_native.abi3t.so"
          modules = [
              name
              for name in zipfile.ZipFile(abi3t).namelist()
              if name.startswith("yggdryl/_native") and name.endswith((".so", ".pyd"))
          ]
          assert modules == [extension], f"{abi3t} holds {modules}, not {extension}"
          print(f"{abi3t} holds {extension}")
          EOF
      # musl's loader refuses an initial-exec thread-local in a module it
      # opens with `dlopen`, and what holds one is its relocations: the five
      # `R_X86_64_TPOFF64` or `R_AARCH64_TLS_TPREL64` the 0.1.13 to 0.1.18
      # musllinux extensions carried for mimalloc's thread-locals. The
      # `STATIC_TLS` flag is no evidence - x86_64's GNU ld writes it beside
      # them and the aarch64 image's writes none. The smoke test below
      # imports the other wheels; this reads every wheel's extension, the
      # 3.10 one the smoke test cannot import included.
      - name: The musl extensions hold no initial-exec thread-local
        if: matrix.musl
        shell: bash
        run: |
          for wheel in dist/*.whl; do
            unpacked="$RUNNER_TEMP/tls/$(basename "$wheel" .whl)"
            mkdir -p "$unpacked"
            unzip -q -o "$wheel" 'yggdryl/_native*.so' -d "$unpacked"
            initial=$(readelf -rW "$unpacked"/yggdryl/_native*.so \
              | grep -cE 'R_(X86_64_TPOFF(32|64)|AARCH64_TLS_TPREL(64)?) ' || true)
            echo "$wheel: $initial initial-exec TLS relocation(s)"
            [ "$initial" -eq 0 ]
          done
      # Every CPython the wheels claim installs one and runs the smoke test in
      # an environment of its own: 3.10 its version-specific wheel, 3.11 to
      # 3.14 the one stable-ABI wheel, which is what proves that wheel loads
      # on interpreters newer than the one that built it, free-threaded 3.14
      # its own wheel. Each 3.15 in `pythons-extension` installs the abi3t
      # wheel by name and no PyArrow, so the script loads the extension
      # module alone, says what it skipped, and on 3.15t asserts the GIL
      # stays off; a row with `smoke: false` runs that half alone. Each
      # interpreter is asserted to be the version and the build its name
      # says. On the macOS x86_64 row each is a self-contained x86_64 CPython
      # from uv under Rosetta 2, because the x64 ones setup-python installs
      # do not start there. On a musl row each is a musl CPython from uv,
      # started by the musl loader installed first and held to musl by its
      # own `HOST_GNU_TYPE`; PyArrow publishes musllinux wheels from 20.0 on,
      # so the whole smoke test runs there.
      - name: Install the musl loader
        if: matrix.musl
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl
      - name: Smoke test the wheels
        shell: bash
        run: |
          python -m pip install uv
          # A fresh environment for `$1` (`3.14`, `3.14t`), its interpreter in
          # `$python`.
          environment() {
            local version=$1 spec=$1
            if [ "${{ matrix.rosetta }}" = true ]; then
              spec="cpython-$version-macos-x86_64-none"
            elif [ "${{ matrix.musl }}" = true ]; then
              spec="cpython-$version-linux-${{ matrix.target }}-musl"
            fi
            local venv="$RUNNER_TEMP/smoke-$version"
            uv venv --seed --python "$spec" "$venv"
            python="$venv/bin/python"
            [ -x "$python" ] || python="$venv/Scripts/python.exe"
            "$python" -c "import platform, sys, sysconfig; print(sys.version, platform.machine()); free = 't' if sysconfig.get_config_var('Py_GIL_DISABLED') == 1 else ''; assert '%d.%d%s' % (*sys.version_info[:2], free) == '$version'"
            if [ "${{ matrix.rosetta }}" = true ]; then
              "$python" -c 'import platform; assert platform.machine() == "x86_64", platform.machine()'
            fi
            if [ "${{ matrix.musl }}" = true ]; then
              "$python" -c 'import sysconfig; host = sysconfig.get_config_var("HOST_GNU_TYPE"); assert host.endswith("-musl"), host'
            fi
          }
          if [ "${{ matrix.smoke }}" = true ]; then
            for version in $(printf '%s' "${{ matrix.pythons }}" | sort -V); do
              environment "$version"
              "$python" -m pip install "pyarrow>=18" "typing_extensions>=4.4" --only-binary ":all:"
              "$python" -m pip install --no-index --find-links dist yggdryl
              "$python" scripts/check_wheel_smoke.py
            done
          fi
          for version in $(printf '%s' "${{ matrix.pythons-extension }}" | sort -V); do
            environment "$version"
            "$python" -m pip install --no-deps dist/yggdryl-*-cp315-abi3.abi3t-*.whl
            "$python" scripts/check_wheel_smoke.py --extension-only
          done
      # Each platform builds and tests its own native module; the npm package
      # ships every one of them, and the generated loader picks the matching
      # binary at require time. The loader and its declarations are the
      # committed ones, which CI keeps equal to what `napi build` generates.
      - name: Build the release native module
        if: matrix.node && runner.os != 'Linux'
        run: npm run build --prefix node
        env:
          CARGO_BUILD_TARGET: ${{ matrix.triple }}
      # The container is what holds the module to the wheels' glibc floor, and
      # nothing else would notice it building somewhere newer, so the floor
      # is read back out of the binary.
      - name: Take the native module the container built
        if: matrix.node && runner.os == 'Linux'
        run: |
          module="node/yggdryl.${{ matrix.node }}.node"
          cp "target/${{ matrix.triple }}/release/libyggdryl_node.so" "$module"
          newest=$(objdump -T "$module" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -n 1)
          echo "$module asks for $newest at most"
          test "$(printf '%s\n' "$newest" GLIBC_2.17 | sort -V | tail -n 1)" = GLIBC_2.17
      - name: Smoke tests against the release binary
        id: node-tests
        if: matrix.node
        run: npm test --prefix node
      # A crash names its file and never its test: the runner reads each file
      # in a child whose report dies with it, and a reporter writes on a later
      # turn of the event loop than the test it reports. Each failing file is
      # read again with `scripts/trace-tests.js` preloaded, which names every
      # test synchronously as it starts, and where lldb is at hand, under it,
      # for every thread's native stack at the fault.
      - name: Name the test a failing file stopped in
        if: failure() && steps.node-tests.outcome == 'failure'
        shell: bash
        working-directory: node
        run: |
          for file in tests/*.test.js tests/*/*.test.js; do
            [ -f "$file" ] || continue
            status=0
            node --require ./scripts/trace-tests.js --test-reporter=spec "$file" > "$file.log" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::$file (exit $status)"
              tail -n 80 "$file.log"
              if [ "$status" -gt 128 ] && command -v lldb > /dev/null; then
                lldb --batch -o run -k "thread backtrace all -c 60" -k "quit 1" -- \
                  "$(command -v node)" --require ./scripts/trace-tests.js "$file" 2>&1 | tail -n 400 || true
              fi
              echo "::endgroup::"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: matrix.node
        with:
          name: node-${{ matrix.node }}
          path: node/*.node
          if-no-files-found: error

  publish-pypi:
    name: PyPI (yggdryl)
    needs: [preflight, sources, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI accepts this workflow's OIDC token instead
      # of a stored password.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A repaired run re-uploads only what is missing.
          skip-existing: true

  publish-npm:
    # Waits on PyPI, and through it on every platform and the source
    # packages: a registry that has answered cannot be taken back, so they
    # publish one after another, the one that has refused a version before
    # first. PyPI refused 0.1.15 (the project had reached its size limit)
    # after npm had it; a refusal there now publishes nothing anywhere, and
    # the same run repaired publishes all three.
    name: npm (yggdryl)
    needs: [preflight, sources, build, publish-pypi]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Trusted publishing: npm accepts this workflow's OIDC token instead of
      # a stored secret, exactly as PyPI does above. The binding names this
      # repository, workflow, and the `npm` environment on npmjs.com, so a
      # migrated repository must be re-registered there.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # No registry-url: npm's OIDC exchange keys off the Actions
          # id-token request variables alone, and that input only writes an
          # `_authToken` placeholder into .npmrc that muddies the failure
          # modes.
          package-manager-cache: false
      - name: Install an npm that speaks trusted publishing
        # OIDC exchange arrived in npm 11.5; node 22 bundles an older one.
        run: npm install -g npm@latest
      - name: Install Node.js packaging tooling
        run: npm ci --prefix node
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: node
          merge-multiple: true
      - name: Every platform binary is present
        run: |
          count=$(ls node/*.node | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 platform binaries, got $count:"
            ls node/*.node
            exit 1
          fi
      - name: Audit the npm package contents
        run: npm run --prefix node test:package:files
      - name: The OIDC grant engaged
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token request variables are absent; npm cannot exchange"
            exit 1
          fi
          echo "id-token request variables are present"
      - name: Publish
        working-directory: node
        run: |
          version="${{ needs.preflight.outputs.version }}"
          if npm view "yggdryl@$version" version >/dev/null 2>&1; then
            echo "npm already has yggdryl $version; skipping"
          else
            # Verbose: npm reports OIDC exchange failures only at this level.
            npm publish --access public --loglevel verbose
          fi

  release:
    # crates.io, then the tag and the GitHub release, after PyPI and npm: the
    # crate goes out once every platform has smoke-tested what it ships, like
    # the other two, and the tag and the release land last because their
    # existence is the statement that the release is complete, and their
    # absence is what makes the next run on `main` finish a half-published
    # one. The sparse index says whether the crate is already up, so a
    # repaired run skips instead of failing.
    name: crates.io, tag and GitHub release
    needs: [preflight, sources, publish-pypi, publish-npm]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${{ needs.preflight.outputs.version }}"
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$version\""; then
            echo "crates.io already has yggdryl $version; skipping"
          else
            cargo publish --locked -p yggdryl
          fi
      - name: Create the tag and the release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ needs.preflight.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released"
          else
            gh release create "$version" --target "$GITHUB_SHA" \
              --title "$version" --generate-notes
          fi

  report:
    # A release that dies is silent where it matters. Its own red tick is on
    # a push nobody opened, `main` goes on spelling a version no registry
    # finished, and the tag - the one record that a version is out - is
    # exactly what a failed run never writes. That is how 0.1.9 reached
    # crates.io and npm, missed PyPI, and then took four commits of feature
    # work under the same number before anyone read the run.
    #
    # So a release that was going to publish and did not says so where it
    # will be read: one issue per version, naming what each registry
    # actually holds. A second failure of the same version comments on that
    # issue rather than opening another, and the issue is the thing to close
    # once the repair run is green.
    #
    # It fires on a failed `preflight` too: three manifests disagreeing, a
    # tag naming a version nothing spells, or a version already half out on
    # a push to `main`. The first two are the one case where no version
    # output exists to name, so the commit names the report instead.
    name: Say so when a release did not finish
    needs: [preflight, sources, build, publish-pypi, publish-npm, release]
    if: >-
      always() && github.event_name != 'workflow_dispatch'
      && (needs.preflight.result == 'failure'
          || (needs.preflight.outputs.publish == 'true'
              && (contains(needs.*.result, 'failure')
                  || contains(needs.*.result, 'cancelled'))))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: The version, and what each registry holds
        id: state
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # A curl that fails reads as "this registry does not have it",
          # which is the safe reading: the report says so and a human looks.
          if [ -z "${VERSION:-}" ]; then
            # Preflight never published one, so the tree is the only source -
            # and it is the tree whose disagreement is being reported.
            VERSION=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])' 2>/dev/null || echo "")
          fi
          if [ -z "$VERSION" ]; then
            echo "title=Release from ${GITHUB_SHA} did not finish" >> "$GITHUB_OUTPUT"
            echo "state=The workspace version could not be read, so this run never chose one." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "title=Release $VERSION did not finish" >> "$GITHUB_OUTPUT"
          held() {
            if [ "$2" = "yes" ]; then echo "- $1: has \`$VERSION\`"; else echo "- $1: does **not** have \`$VERSION\`"; fi
          }
          crate=no
          if curl -fsSL "https://index.crates.io/yg/gd/yggdryl" | grep -q "\"vers\":\"$VERSION\""; then crate=yes; fi
          pypi=no
          if curl -fsSL "https://pypi.org/pypi/yggdryl/$VERSION/json" >/dev/null 2>&1; then pypi=yes; fi
          npm=no
          if curl -fsSL "https://registry.npmjs.org/yggdryl/$VERSION" >/dev/null 2>&1; then npm=yes; fi
          {
            echo "state<<YGGEOF"
            held "crates.io" "$crate"
            held "PyPI" "$pypi"
            held "npm" "$npm"
            echo "YGGEOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$crate$pypi$npm" != "nonono" ] && [ "$crate$pypi$npm" != "yesyesyes" ]; then
            echo "::error title=Half published::$VERSION is on some registries and not others"
          fi
      - name: File the report, or add to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ steps.state.outputs.title }}
          STATE: ${{ steps.state.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "The release from \`$GITHUB_SHA\` did not finish: $RUN_URL" \
            "$STATE" \
            "No tag is written until every registry has the version, so the next push to \`main\` spelling this version will try again. Fix the cause on \`main\` first: every publish skips a registry that already has the version, and the tag lands last." \
            "A version some registries carry and others do not must not be republished from a tree that has moved. Finish it from the commit it was built at by pushing \`v<version>\` there, or leave it partial and bump."
          )
          # The title is the key: a hidden marker is not reliably indexed by
          # issue search, and two failures minutes apart would both miss it.
          open=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
            echo "commented on #$open"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
