[package]
name = "yggdryl"
description = "Allocation-conscious Arrow schemas, fields, resource identifiers, byte-oriented values, and record I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["arrow", "schema", "field", "uri", "codec"]
categories = ["data-structures", "encoding"]

[features]
default = ["arrow"]
arrow = [
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-cast",
    "dep:arrow-data",
    "dep:arrow-ipc",
    "dep:arrow-ord",
    "dep:arrow-row",
    "dep:arrow-select",
]
# Apache Parquet data files. Not default: the codec is version-locked to the
# pinned Arrow release and pulls a thrift/compression stack a schema-only
# consumer does not need. `snap` rides here because the parquet crate already
# compiles it, so Avro's snappy blocks cost no crate a build was not paying.
parquet = ["arrow", "dep:bytes", "dep:parquet", "dep:snap"]
# Iceberg tables. Official Iceberg 0.10.1 owns metadata serde and validation;
# its Rust 1.94/Arrow 58 stack stays private. Public records use Yggdryl's
# Arrow 59/IOBase path, and schema-only builds do not compile this feature.
iceberg = ["arrow", "parquet", "dep:iceberg-official", "dep:uuid"]
# Amazon S3 objects behind `IOBase`. Not default: the signed HTTPS client and
# its TLS stack are a cost a local or schema-only consumer never pays. The
# protocol is spoken directly - SigV4 over a synchronous HTTP/1.1 client - so
# no SDK, runtime, or async executor rides in.
s3 = ["dep:hmac", "dep:md-5", "dep:sha2", "dep:ureq"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-cast = { workspace = true, optional = true }
arrow-data = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-ord = { workspace = true, optional = true }
arrow-row = { workspace = true, optional = true }
arrow-schema.workspace = true
arrow-select = { workspace = true, optional = true }
base64.workspace = true
bytes = { version = "1", optional = true }
# zlib-rs is the fastest pure-Rust DEFLATE; still no C toolchain needed.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
half.workspace = true
# HMAC-SHA256 and SHA-256 for AWS Signature Version 4: the two primitives the
# S3 backend signs with, from the pure-Rust RustCrypto family.
hmac = { version = "0.13", optional = true }
# MD5 for the one S3 request that still demands `Content-MD5`: the bulk
# delete. Same RustCrypto generation as `sha2`, so no second digest stack.
md-5 = { version = "0.11", optional = true }
# Metadata-only boundary: official Arrow 58 types never enter public APIs.
iceberg-official = { package = "iceberg", version = "=0.10.1", default-features = false, optional = true }
log.workspace = true
memmap2 = "0.9"
# The full engine: literal prefilters and the lazy DFA are what let the line
# projection outrun CPython's C `re` loop on the same corpus. `memchr` rides
# in regex's own tree, so naming it for the line scan costs no extra crate.
memchr = "2.7"
regex = "1.11"
regex-automata = "0.4"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive", "rc"] }
saphyr-parser = "=0.0.11"
parquet = { version = "59.2.0", default-features = false, features = [
    "arrow",
    "base64",
    "brotli",
    "flate2-zlib-rs",
    "lz4",
    "snap",
    "zstd",
], optional = true }
serde_json = { version = "1.0", features = ["raw_value", "unbounded_depth"] }
sha2 = { version = "0.11", optional = true }
smol_str = { version = "=0.3.2", features = ["serde"] }
# Raw snappy blocks for Avro containers; optional because the parquet crate is
# what already pulls it, so it rides that feature rather than adding a crate.
snap = { version = "1.1", optional = true }
zstd = { version = "0.13", default-features = false }
toml = { version = "=1.1.4", features = ["preserve_order"] }
# The xxHash protocol itself: XXH32, XXH64, XXH3-64, and XXH3-128, with the
# runtime AVX2/SSE2/NEON dispatch that keeps XXH3 at reference speed. The
# `parquet` feature already compiles it, so a table build pays nothing new; the
# four algorithm features plus `std` pull no transitive crate, and `random` is
# off because a `RandomState` would drag `rand` in for nothing.
twox-hash = { version = "=2.1.3", default-features = false, features = [
    "xxhash32",
    "xxhash64",
    "xxhash3_64",
    "xxhash3_128",
    "std",
] }
# The synchronous HTTP/1.1 client under the S3 backend: connection pooling,
# rustls, no async runtime. Compression is off because S3 bodies are the
# bytes a caller asked for, and decoding them here would corrupt a range.
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
uuid = { version = "1.18", features = ["v7"], optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The trusted Arrow-ecosystem S3 client the S3 benchmarks are measured
# against, on the same in-process server and the same payloads. Pinned to
# the release that shares the reqwest and tokio versions the workspace
# already locks, so the baseline adds no second HTTP stack.
# The streams `object_store` answers with are consumed through its own
# ecosystem's combinators; nothing here reaches a public signature. Held at
# 0.13.1: 0.13.2 declares this workspace's own MSRV and then uses let-chains,
# which need 1.88, so it would raise the floor for everyone through a
# dev-dependency that only a benchmark reads.
futures = "0.3"
object_store = { version = "=0.13.1", features = ["aws"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }


[[bench]]
name = "types"
path = "benchmarks/types.rs"
harness = false

# The FIX registry: tiered resolution against a plain map, mutation over a
# realistic dictionary, and shard loading against shard count. The module is
# unconditional, so the target compiles in a default build.
[[bench]]
name = "fix"
path = "benchmarks/fix.rs"
harness = false

[[bench]]
name = "uri"
path = "benchmarks/uri.rs"
harness = false

# The generic Arrow scalar family: construction per shape, the reader funnel
# measured to the first batch and to the last, collapsing a stream, casting
# against the bare call it wraps, and structured text against the native
# `Scalar` pair. Every group needs Arrow, which the default feature carries.
[[bench]]
name = "arrow"
path = "benchmarks/arrow.rs"
harness = false

[[bench]]
name = "expression"
path = "benchmarks/expression.rs"
harness = false

[[bench]]
name = "text"
path = "benchmarks/text.rs"
harness = false

[[bench]]
name = "coding"
path = "benchmarks/coding.rs"
harness = false

# Record media: Avro is unconditional; Parquet-backed I/O and Iceberg groups
# compile only with their owning features.
[[bench]]
name = "media"
path = "benchmarks/media.rs"
harness = false

# The digest surface: throughput per algorithm and size, this module's
# overhead over the protocol crate it wraps, the constant-memory handle read,
# the canonical value feed, and the Arrow row-digest column. The value codec
# needs no Arrow, so the target compiles in a default build; the row-digest
# group is compiled in only when that feature is.
[[bench]]
name = "xxhash"
path = "benchmarks/xxhash.rs"
harness = false

# Foreign Arrow filesystems behind IOBase: byte-level wrapper overhead against
# the handle each backend wraps, record round trips, and listing. The vtable
# adds no dependency, so this target compiles in a default build; the Parquet
# leg of the record group is compiled in only when that feature is, and the
# S3 groups - measured against `object_store` on one in-process server -
# only with the `s3` feature.
[[bench]]
name = "holder"
path = "benchmarks/holder.rs"
harness = false

[[test]]
name = "types"
required-features = ["arrow"]

[[test]]
name = "arrow"
required-features = ["arrow"]

# The landing-page example materializes Arrow values, so it does not compile
# in a schema-only build.
[[test]]
name = "docs_index"
required-features = ["arrow"]
