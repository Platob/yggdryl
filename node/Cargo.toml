[package]
name = "yggdryl-node"
version.workspace = true
description = "Native Node.js views over Yggdryl schemas, records, tabular Arrow interop, URIs, and structured codecs"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
base64.workspace = true
half.workspace = true
napi = { workspace = true, features = ["serde-json"] }
napi-derive.workspace = true
yggdryl = { path = "../rust", default-features = false, features = [
    "http3",
    "iceberg",
    "s3",
    "s3tables",
] }
# The `.xmla` medium, registered with the core when the addon loads, so an
# `IOBase` named by a rowset document reads and writes it as it always did.
yggdryl-xmla = { path = "../xmla" }
serde_json = "1"

[build-dependencies]
napi-build.workspace = true

[lints]
workspace = true
