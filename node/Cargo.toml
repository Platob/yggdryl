[package]
name = "yggdryl-node"
version.workspace = true
description = "Native Node.js views over Yggdryl schemas, records, tabular Arrow interop, URIs, and structured codecs"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
base64 = "0.22"
half.workspace = true
napi = { workspace = true, features = ["serde-json"] }
napi-derive.workspace = true
# Only for naming a page compression: the codec value is a Parquet type, and
# spelling it here beats re-deriving its name from foreign `Display` text.
parquet = { version = "59.2.0", default-features = false }
yggdryl = { path = "../rust", default-features = false, features = [
    "arrow",
    "parquet",
    "iceberg",
] }
serde_json = "1"

[build-dependencies]
napi-build.workspace = true

[lints]
workspace = true
